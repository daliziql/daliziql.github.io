","cǎi","cǎi","","bái","lù","wèi","yǐ","","suǒ","wèi","yī","rén","","zài","shuǐ","zhī","sì","","sù","huí","cóng","zhī","","dào","zǔ","qiě","yòu","","sù","yóu","cóng","zhī","","wǎn","zài","shuǐ","zhōng","zhǐ",""]},"variants":[],"quote":"所谓伊人，在水一方。","background":"选自《诗经·秦风》。关于“伊人”所指，历来有不同解释；可以先按追寻心中所慕之人来读。","reading":"芦苇、秋水和白露营造出清冷朦胧的景象。每次似乎快要找到对方，道路和水流又把人隔开。三章重复而略有变化，将执着追寻与可望难即的惆怅交织起来。","backgroundUrl":"https://www.guwendao.net/shiwenv_15cd220102d6.aspx"},{"n":3,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_7f09a756c9c0.aspx","title":{"text":"迢迢牵牛星","pinyin":["tiáo","tiáo","qiān","niú","xīng"]},"author":{"text":"汉 · 佚名","pinyin":["hàn","","","","yì","míng"]},"body":{"text":"迢迢牵牛星，皎皎河汉女。\n纤纤擢素手，札札弄机杼。\n终日不成章，泣涕零如雨。\n河汉清且浅，相去复几许。\n盈盈一水间，脉脉不得语。","pinyin":["tiáo","tiáo","qiān","niú","xīng","","jiǎo","jiǎo","hé","hàn","nǚ","","","xiān","xiān","zhuó","sù","shǒu","","zhá","zhá","nòng","jī","zhù","","","zhōng","rì","bù","chéng","zhāng","","qì","tì","líng","rú","yǔ","","","hé","hàn","qīng","qiě","qiǎn","","xiāng","qù","fù","jǐ","xǔ","","","yíng","yíng","yī","shuǐ","jiān","","mò","mò","bù","dé","yǔ",""]},"variants":[],"quote":"盈盈一水间，脉脉不得语。","background":"《古诗十九首》之一，通常归于东汉后期的文人诗。作品借牛郎织女隔河相望的传说，写人间的离别。","reading":"织女整天织不成布，泪水不停，连近在眼前的银河也无法跨越。“迢迢”“纤纤”“脉脉”等叠词让语调回环，结尾的沉默比直接诉苦更能表现相思。","backgroundUrl":"https://www.guwendao.net/shiwenv_7f09a756c9c0.aspx"},{"n":4,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_183d69f50755.aspx","title":{"text":"长歌行","pinyin":["cháng","gē","xíng"]},"author":{"text":"汉 · 汉乐府","pinyin":["hàn","","","","hàn","yuè","fǔ"]},"body":{"text":"青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！","pinyin":["qīng","qīng","yuán","zhōng","kuí","","zhāo","lù","dài","rì","xī","","","yáng","chūn","bù","dé","zé","","wàn","wù","shēng","guāng","huī","","","cháng","kǒng","qiū","jié","zhì","","kūn","huáng","huá","yè","shuāi","","","bǎi","chuān","dōng","dào","hǎi","","hé","shí","fù","xī","guī","","","shào","zhuàng","bù","nǔ","lì","","lǎo","dà","tú","shāng","bēi",""]},"variants":[],"quote":"少壮不努力，老大徒伤悲！","background":"汉乐府诗，收在《乐府诗集》的相和歌辞中。“长歌行”是乐府曲题，作品围绕时光与人生展开。","reading":"春日的植物欣欣向荣，却终会迎来衰败；江河奔向大海，也无法倒流。诗由这些可见的变化引出劝勉：珍惜年轻时的精力与机会，让结尾的道理有了具体的形象。","backgroundUrl":"https://www.guwendao.net/shiwenv_183d69f50755.aspx"},{"n":5,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_630c04c81858.aspx","title":{"text":"观沧海","pinyin":["guān","cāng","hǎi"]},"author":{"text":"东汉 · 曹操","pinyin":["dōng","hàn","","","","cáo","cāo"]},"body":{"text":"东临碣石，以观沧海。\n水何澹澹，山岛竦峙。\n树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。\n日月之行，若出其中；\n星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。","pinyin":["dōng","lín","jié","shí","","yǐ","guān","cāng","hǎi","","","shuǐ","hé","dàn","dàn","","shān","dǎo","sǒng","zhì","","","shù","mù","cóng","shēng","","bǎi","cǎo","fēng","mào","","","qiū","fēng","xiāo","sè","","hóng","bō","yǒng","qǐ","","","rì","yuè","zhī","xíng","","ruò","chū","qí","zhōng","","","xīng","hàn","càn","làn","","ruò","chū","qí","lǐ","","","xìng","shèn","zhì","zāi","","gē","yǐ","yǒng","zhì",""]},"variants":[],"quote":"日月之行，若出其中；星汉灿烂，若出其里。","background":"一般认为作于曹操北征乌桓后经过碣石之时，属于乐府组诗《步出夏门行》。","reading":"前半写海水、山岛、树木与秋风，后半想象日月星辰都在大海中运行。眼前景色被推向宇宙般的尺度，也使人感到诗人开阔的胸怀和建功立业的抱负。","backgroundUrl":"https://www.guwendao.net/shiwenv_630c04c81858.aspx"},{"n":6,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_d78b6331098e.aspx","title":{"text":"龟虽寿","pinyin":["guī","suī","shòu"]},"author":{"text":"东汉 · 曹操","pinyin":["dōng","hàn","","","","cáo","cāo"]},"body":{"text":"神龟虽寿，犹有竟时；\n腾蛇乘雾，终为土灰。\n老骥伏枥，志在千里；\n烈士暮年，壮心不已。\n盈缩之期，不但在天；\n养怡之福，可得永年。\n幸甚至哉，歌以咏志。","pinyin":["shén","guī","suī","shòu","","yóu","yǒu","jìng","shí","","","téng","shé","chéng","wù","","zhōng","wéi","tǔ","huī","","","lǎo","jì","fú","lì","","zhì","zài","qiān","lǐ","","","liè","shì","mù","nián","","zhuàng","xīn","bù","yǐ","","","yíng","suō","zhī","qī","","bù","dàn","zài","tiān","","","yǎng","yí","zhī","fú","","kě","dé","yǒng","nián","","","xìng","shèn","zhì","zāi","","gē","yǐ","yǒng","zhì",""]},"variants":["腾 一作：螣"],"quote":"老骥伏枥，志在千里。","background":"同属曹操的《步出夏门行》组诗，通常联系他北征乌桓后的处境来理解：事业尚未完成，年龄却在增长。","reading":"开头承认生命终有尽头，随后用老马仍想奔驰来表达不减的志气。结尾又谈到调养身心，既有进取的热情，也有对生命规律的清醒认识。","backgroundUrl":"https://www.guwendao.net/shiwenv_d78b6331098e.aspx"},{"n":7,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_35000de73cdb.aspx","title":{"text":"短歌行","pinyin":["duǎn","gē","xíng"]},"author":{"text":"东汉 · 曹操","pinyin":["dōng","hàn","","","","cáo","cāo"]},"body":{"text":"对酒当歌，人生几何！\n譬如朝露，去日苦多。\n慨当以慷，忧思难忘。\n何以解忧？\n唯有杜康。\n青青子衿，悠悠我心。\n但为君故，沉吟至今。\n呦呦鹿鸣，食野之苹。\n我有嘉宾，鼓瑟吹笙。\n明明如月，何时可掇？\n忧从中来，不可断绝。\n越陌度阡，枉用相存。\n契阔谈宴，心念旧恩。\n月明星稀，乌鹊南飞。\n绕树三匝，何枝可依？\n山不厌高，海不厌深。\n周公吐哺，天下归心。","pinyin":["duì","jiǔ","dāng","gē","","rén","shēng","jǐ","hé","","","pì","rú","zhāo","lù","","qù","rì","kǔ","duō","","","kǎi","dāng","yǐ","kāng","","yōu","sī","nán","wàng","","","hé","yǐ","jiě","yōu","","","wéi","yǒu","dù","kāng","","","qīng","qīng","zǐ","jīn","","yōu","yōu","wǒ","xīn","","","dàn","wèi","jūn","gù","","chén","yín","zhì","jīn","","","yōu","yōu","lù","míng","","shí","yě","zhī","píng","","","wǒ","yǒu","jiā","bīn","","gǔ","sè","chuī","shēng","","","míng","míng","rú","yuè","","hé","shí","kě","duō","","","yōu","cóng","zhōng","lái","","bù","kě","duàn","jué","","","yuè","mò","dù","qiān","","wǎng","yòng","xiāng","cún","","","qì","kuò","tán","yàn","","xīn","niàn","jiù","ēn","","","yuè","míng","xīng","xī","","wū","què","nán","fēi","","","rào","shù","sān","zā","","hé","zhī","kě","yī","","","shān","bù","yàn","gāo","","hǎi","bù","yàn","shēn","","","zhōu","gōng","tǔ","bǔ","","tiān","xià","guī","xīn",""]},"variants":["唯 一作：惟","明明 一作：皎皎","谈宴 一作：谈讌/谈䜩","海不厌深 一作：水不厌深"],"quote":"对酒当歌，人生几何！","background":"曹操沿用乐府旧题写成的诗，具体作年有争议。全篇与他招纳人才、谋求统一的愿望紧密相连。","reading":"从感叹人生短暂，到引用《诗经》表达对贤才的渴望，再到以周公自许，感情不断推进。酒与忧愁贯穿全诗，而这份忧愁包含时间紧迫、人才难求的焦虑。","backgroundUrl":"https://www.guwendao.net/shiwenv_35000de73cdb.aspx"},{"n":8,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_a537ff195683.aspx","title":{"text":"归园田居·其一","pinyin":["guī","yuán","tián","jū","","qí","yī"]},"author":{"text":"东晋 · 陶渊明","pinyin":["dōng","jìn","","","","táo","yuān","míng"]},"body":{"text":"少无适俗韵，性本爱丘山。\n误落尘网中，一去三十年。\n羁鸟恋旧林，池鱼思故渊。\n开荒南野际，守拙归园田。\n方宅十余亩，草屋八九间。\n榆柳荫后檐，桃李罗堂前。\n暧暧远人村，依依墟里烟。\n狗吠深巷中，鸡鸣桑树颠。\n户庭无尘杂，虚室有余闲。\n久在樊笼里，复得返自然。","pinyin":["shào","wú","shì","sú","yùn","","xìng","běn","ài","qiū","shān","","","wù","luò","chén","wǎng","zhōng","","yī","qù","sān","shí","nián","","","jī","niǎo","liàn","jiù","lín","","chí","yú","sī","gù","yuān","","","kāi","huāng","nán","yě","jì","","shǒu","zhuō","guī","yuán","tián","","","fāng","zhái","shí","yú","mǔ","","cǎo","wū","bā","jiǔ","jiān","","","yú","liǔ","yìn","hòu","yán","","táo","lǐ","luó","táng","qián","","","ài","ài","yuǎn","rén","cūn","","yī","yī","xū","lǐ","yān","","","gǒu","fèi","shēn","xiàng","zhōng","","jī","míng","sāng","shù","diān","","","hù","tíng","wú","chén","zá","","xū","shì","yǒu","yú","xián","","","jiǔ","zài","fán","lóng","lǐ","","fù","dé","fǎn","zì","rán",""]},"variants":["误落 一作：误入"],"quote":"久在樊笼里，复得返自然。","background":"陶渊明辞去彭泽县令、回到田园后写下《归园田居》组诗，这里选第一首。","reading":"诗先回顾身陷仕途的压抑，再写屋舍、树木、村烟、鸡犬。田园日常之所以令人亲近，在于它使诗人重新按自己的性情生活。末句的喜悦，来自终于找回自由。","backgroundUrl":"https://www.guwendao.net/shiwenv_a537ff195683.aspx"},{"n":9,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_5b90a9bb5230.aspx","title":{"text":"饮酒·其五","pinyin":["yǐn","jiǔ","","qí","wǔ"]},"author":{"text":"东晋 · 陶渊明","pinyin":["dōng","jìn","","","","táo","yuān","míng"]},"body":{"text":"结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。","pinyin":["jié","lú","zài","rén","jìng","","ér","wú","chē","mǎ","xuān","","","wèn","jūn","hé","néng","ěr","","xīn","yuǎn","dì","zì","piān","","","cǎi","jú","dōng","lí","xià","","yōu","rán","jiàn","nán","shān","","","shān","qì","rì","xī","jiā","","fēi","niǎo","xiāng","yǔ","huán","","","cǐ","zhōng","yǒu","zhēn","yì","","yù","biàn","yǐ","wàng","yán",""]},"variants":[],"quote":"采菊东篱下，悠然见南山。","background":"《饮酒二十首》中的第五首，写陶渊明归隐生活中的心境；组诗的具体作年有不同说法。","reading":"住在人群中也能感到安静，关键在于心与名利纷争的距离。采菊时不经意看见南山，继而感受山气与归鸟的和谐；“欲辨已忘言”写出一种难以说尽的领悟。","backgroundUrl":"https://www.guwendao.net/shiwenv_5b90a9bb5230.aspx"},{"n":10,"group":"先秦至六朝","url":"https://www.guwendao.net/shiwenv_2d6b0c83a500.aspx","title":{"text":"木兰诗","pinyin":["mù","lán","shī"]},"author":{"text":"南北朝 · 北朝民歌","pinyin":["nán","běi","cháo","","","","běi","cháo","mín","gē"]},"body":{"text":"唧唧复唧唧，木兰当户织。不闻机杼声，唯闻女叹息。\n\n问女何所思，问女何所忆。女亦无所思，女亦无所忆。昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。\n\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。旦辞爷娘去，暮宿黄河边，不闻爷娘唤女声，但闻黄河流水鸣溅溅。旦辞黄河去，暮至黑山头，不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。开我东阁门，坐我西阁床。脱我战时袍，著我旧时裳。当窗理云鬓，对镜帖花黄。出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？","pinyin":["jī","jī","fù","jī","jī","","mù","lán","dāng","hù","zhī","","bù","wén","jī","zhù","shēng","","wéi","wén","nǚ","tàn","xī","","","","wèn","nǚ","hé","suǒ","sī","","wèn","nǚ","hé","suǒ","yì","","nǚ","yì","wú","suǒ","sī","","nǚ","yì","wú","suǒ","yì","","zuó","yè","jiàn","jūn","tiě","","kè","hán","dà","diǎn","bīng","","jūn","shū","shí","èr","juàn","","juàn","juàn","yǒu","yé","míng","","ā","yé","wú","dà","ér","","mù","lán","wú","zhǎng","xiōng","","yuàn","wèi","shì","ān","mǎ","","cóng","cǐ","tì","yé","zhēng","","","","dōng","shì","mǎi","jùn","mǎ","","xī","shì","mǎi","ān","jiān","","nán","shì","mǎi","pèi","tóu","","běi","shì","mǎi","cháng","biān","","dàn","cí","yé","niáng","qù","","mù","sù","huáng","hé","biān","","bù","wén","yé","niáng","huàn","nǚ","shēng","","dàn","wén","huáng","hé","liú","shuǐ","míng","jiān","jiān","","dàn","cí","huáng","hé","qù","","mù","zhì","hēi","shān","tóu","","bù","wén","yé","niáng","huàn","nǚ","shēng","","dàn","wén","yān","shān","hú","qí","míng","jiū","jiū","","","","wàn","lǐ","fù","róng","jī","","guān","shān","dù","ruò","fēi","","shuò","qì","chuán","jīn","tuò","","hán","guāng","zhào","tiě","yī","","jiāng","jūn","bǎi","zhàn","sǐ","","zhuàng","shì","shí","nián","guī","","","","guī","lái","jiàn","tiān","zǐ","","tiān","zǐ","zuò","míng","táng","","cè","xūn","shí","èr","zhuǎn","","shǎng","cì","bǎi","qiān","qiáng","","kè","hán","wèn","suǒ","yù","","mù","lán","bù","yòng","shàng","shū","láng","","yuàn","chí","qiān","lǐ","zú","","sòng","ér","huán","gù","xiāng","","","","yé","niáng","wén","nǚ","lái","","chū","guō","xiāng","fú","jiāng","","ā","zǐ","wén","mèi","lái","","dāng","hù","lǐ","hóng","zhuāng","","xiǎo","dì","wén","zǐ","lái","","mó","dāo","huò","huò","xiàng","zhū","yáng","","kāi","wǒ","dōng","gé","mén","","zuò","wǒ","xī","gé","chuáng","","tuō","wǒ","zhàn","shí","páo","","zhuó","wǒ","jiù","shí","cháng","","dāng","chuāng","lǐ","yún","bìn","","duì","jìng","tiē","huā","huáng","","chū","mén","kàn","huǒ","bàn","","huǒ","bàn","jiē","jīng","máng","","tóng","xíng","shí","èr","nián","","bù","zhī","mù","lán","shì","nǚ","láng","","","","xióng","tù","jiǎo","pū","shuò","","cí","tù","yǎn","mí","lí","","shuāng","tù","bàng","dì","zǒu","","ān","néng","biàn","wǒ","shì","xióng","cí",""]},"variants":["唯 一作：惟"],"quote":"万里赴戎机，关山度若飞。","background":"北朝民歌，后收入《乐府诗集》，在流传中经过加工润色。作品讲述木兰替父从军、立功还乡的故事。","reading":"诗详写出征准备和归家团聚，战场岁月却高度浓缩，因此木兰既英勇，也有鲜明的家庭情感。结尾以双兔作比，回应身份揭晓的惊讶，赞美她不受性别成见限制的才干。","backgroundUrl":"https://www.guwendao.net/shiwenv_2d6b0c83a500.aspx"},{"n":11,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_44ba4afb80db.aspx","title":{"text":"山居秋暝","pinyin":["shān","jū","qiū","míng"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。","pinyin":["kōng","shān","xīn","yǔ","hòu","","tiān","qì","wǎn","lái","qiū","","","míng","yuè","sōng","jiān","zhào","","qīng","quán","shí","shàng","liú","","","zhú","xuān","guī","huàn","nǚ","","lián","dòng","xià","yú","zhōu","","","suí","yì","chūn","fāng","xiē","","wáng","sūn","zì","kě","liú",""]},"variants":[],"quote":"明月松间照，清泉石上流。","background":"通常认为写于王维居住辋川、过着亦官亦隐生活的时期。“秋暝”点出秋日傍晚的时间。","reading":"雨后山林里，月光与清泉清澈宁静，浣女的笑声和渔舟的移动又带来生活气息。声响衬出幽静，人物使山居可亲，结尾由赏景自然转为愿意留下来的心情。","backgroundUrl":"https://www.guwendao.net/shiwenv_44ba4afb80db.aspx"},{"n":12,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_cd7027786b98.aspx","title":{"text":"终南别业","pinyin":["zhōng","nán","bié","yè"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"中岁颇好道，晚家南山陲。\n兴来每独往，胜事空自知。\n行到水穷处，坐看云起时。\n偶然值林叟，谈笑无还期。","pinyin":["zhōng","suì","pō","hào","dào","","wǎn","jiā","nán","shān","chuí","","","xìng","lái","měi","dú","wǎng","","shèng","shì","kōng","zì","zhī","","","xíng","dào","shuǐ","qióng","chù","","zuò","kàn","yún","qǐ","shí","","","ǒu","rán","zhí","lín","sǒu","","tán","xiào","wú","huán","qī",""]},"variants":[],"quote":"行到水穷处，坐看云起时。","background":"王维晚年山居诗。“别业”指别墅、别居，作品呈现他在终南山一带的闲居生活。","reading":"兴致来了便独自出游，走到水的尽头就坐看云起，遇见老人又谈到忘归。行动随景物与心情展开，尤其“水穷”“云起”的转接，让人感到从容而有余地。","backgroundUrl":"https://www.guwendao.net/shiwenv_cd7027786b98.aspx"},{"n":13,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_4809b5e7a16a.aspx","title":{"text":"竹里馆","pinyin":["zhú","lǐ","guǎn"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"独坐幽篁里，弹琴复长啸。\n深林人不知，明月来相照。","pinyin":["dú","zuò","yōu","huáng","lǐ","","tán","qín","fù","cháng","xiào","","","shēn","lín","rén","bù","zhī","","míng","yuè","lái","xiāng","zhào",""]},"variants":[],"quote":"深林人不知，明月来相照。","background":"《辋川集》中的一首，写王维辋川山居的一处景致。“竹里馆”是被竹林环绕的居所。","reading":"全诗只有独坐、弹琴、长啸和月光几笔。外人不知道诗人在此，明月却像知己一样来相照；这份独处带着安静的满足，声音也让竹林的幽深更可感。","backgroundUrl":"https://www.guwendao.net/shiwenv_4809b5e7a16a.aspx"},{"n":14,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_e2890c61279c.aspx","title":{"text":"题破山寺后禅院","pinyin":["tí","pò","shān","sì","hòu","chán","yuàn"]},"author":{"text":"唐 · 常建","pinyin":["táng","","","","cháng","jiàn"]},"body":{"text":"清晨入古寺，初日照高林。\n竹径通幽处，禅房花木深。\n山光悦鸟性，潭影空人心。\n万籁此都寂，但余钟磬音。","pinyin":["qīng","chén","rù","gǔ","sì","","chū","rì","zhào","gāo","lín","","","zhú","jìng","tōng","yōu","chù","","chán","fáng","huā","mù","shēn","","","shān","guāng","yuè","niǎo","xìng","","tán","yǐng","kōng","rén","xīn","","","wàn","lài","cǐ","dōu","jì","","dàn","yú","zhōng","qìng","yīn",""]},"variants":["竹 一作：曲","都寂 一作：俱寂；但余 一作：惟余"],"quote":"竹径通幽处，禅房花木深。","background":"常建游览破山寺后禅院时所作。破山寺即今江苏常熟的兴福寺。","reading":"视线从晨光中的山寺，沿竹径深入花木掩映的禅房。鸟鸣、潭影和钟磬声使心绪逐渐安定下来，整首诗像一次从外部景色走向内心澄静的游历。","backgroundUrl":"https://www.guwendao.net/shiwenv_e2890c61279c.aspx"},{"n":15,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_4a0d548bebb3.aspx","title":{"text":"过故人庄","pinyin":["guò","gù","rén","zhuāng"]},"author":{"text":"唐 · 孟浩然","pinyin":["táng","","","","mèng","hào","rán"]},"body":{"text":"故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。","pinyin":["gù","rén","jù","jī","shǔ","","yāo","wǒ","zhì","tián","jiā","","","lǜ","shù","cūn","biān","hé","","qīng","shān","guō","wài","xié","","","kāi","xuān","miàn","cháng","pǔ","","bǎ","jiǔ","huà","sāng","má","","","dài","dào","chóng","yáng","rì","","huán","lái","jiù","jú","huā",""]},"variants":[],"quote":"开轩面场圃，把酒话桑麻。","background":"孟浩然应老朋友邀请到乡村做客，写下这首田园诗。“过”在题目中是拜访的意思。","reading":"鸡黍招待、绿树青山、窗前田地和农事闲谈，都写得自然亲切。结尾相约重阳再来，把一次普通聚会延伸为长久交往，友情就藏在这些日常细节里。","backgroundUrl":"https://www.guwendao.net/shiwenv_4a0d548bebb3.aspx"},{"n":16,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_ae20659aff8c.aspx","title":{"text":"望洞庭湖赠张丞相","pinyin":["wàng","dòng","tíng","hú","zèng","zhāng","chéng","xiàng"]},"author":{"text":"唐 · 孟浩然","pinyin":["táng","","","","mèng","hào","rán"]},"body":{"text":"八月湖水平，涵虚混太清。\n气蒸云梦泽，波撼岳阳城。\n欲济无舟楫，端居耻圣明。\n坐观垂钓者，徒有羡鱼情。","pinyin":["bā","yuè","hú","shuǐ","píng","","hán","xū","hùn","tài","qīng","","","qì","zhēng","yún","mèng","zé","","bō","hàn","yuè","yáng","chéng","","","yù","jì","wú","zhōu","jí","","duān","jū","chǐ","shèng","míng","","","zuò","guān","chuí","diào","zhě","","tú","yǒu","xiàn","yú","qíng",""]},"variants":[],"quote":"气蒸云梦泽，波撼岳阳城。","background":"这是一首赠诗，也有请求引荐的用意：孟浩然希望获得从政的机会，向张丞相表达心愿。","reading":"前半以蒸腾水气、撼动城郭的湖势写洞庭之壮阔，后半借没有船桨、羡慕垂钓来表达有志而缺少门路。读到“欲济无舟楫”，景物便与诗人的现实处境接上了。","backgroundUrl":"https://www.guwendao.net/shiwenv_ae20659aff8c.aspx"},{"n":17,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_af218ed70405.aspx","title":{"text":"钱塘湖春行","pinyin":["qián","táng","hú","chūn","xíng"]},"author":{"text":"唐 · 白居易","pinyin":["táng","","","","bái","jū","yì"]},"body":{"text":"孤山寺北贾亭西，水面初平云脚低。\n几处早莺争暖树，谁家新燕啄春泥。\n乱花渐欲迷人眼，浅草才能没马蹄。\n最爱湖东行不足，绿杨阴里白沙堤。","pinyin":["gū","shān","sì","běi","jiǎ","tíng","xī","","shuǐ","miàn","chū","píng","yún","jiǎo","dī","","","jǐ","chù","zǎo","yīng","zhēng","nuǎn","shù","","shuí","jiā","xīn","yàn","zhuó","chūn","ní","","","luàn","huā","jiàn","yù","mí","rén","yǎn","","qiǎn","cǎo","cái","néng","mò","mǎ","tí","","","zuì","ài","hú","dōng","xíng","bù","zú","","lǜ","yáng","yīn","lǐ","bái","shā","dī",""]},"variants":[],"quote":"乱花渐欲迷人眼，浅草才能没马蹄。","background":"白居易任杭州刺史期间所作，描写春游西湖的见闻。“钱塘湖”就是西湖。","reading":"“早莺”“新燕”“渐欲”“才能”都指向刚刚到来的春天。诗随着游踪展开，用动物的忙碌和花草的初生表现季节变化，最后落到最喜爱的湖东白堤，情绪轻快鲜明。","backgroundUrl":"https://www.guwendao.net/shiwenv_af218ed70405.aspx"},{"n":18,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_09294abb5f67.aspx","title":{"text":"游山西村","pinyin":["yóu","shān","xī","cūn"]},"author":{"text":"宋 · 陆游","pinyin":["sòng","","","","lù","yóu"]},"body":{"text":"莫笑农家腊酒浑，丰年留客足鸡豚。\n山重水复疑无路，柳暗花明又一村。\n箫鼓追随春社近，衣冠简朴古风存。\n从今若许闲乘月，拄杖无时夜叩门。","pinyin":["mò","xiào","nóng","jiā","là","jiǔ","hún","","fēng","nián","liú","kè","zú","jī","tún","","","shān","chóng","shuǐ","fù","yí","wú","lù","","liǔ","àn","huā","míng","yòu","yī","cūn","","","xiāo","gǔ","zhuī","suí","chūn","shè","jìn","","yī","guān","jiǎn","pǔ","gǔ","fēng","cún","","","cóng","jīn","ruò","xǔ","xián","chéng","yuè","","zhǔ","zhàng","wú","shí","yè","kòu","mén",""]},"variants":[],"quote":"山重水复疑无路，柳暗花明又一村。","background":"陆游罢官回到山阴故乡后，游访村庄写下此诗。诗中保留了村民待客和春社活动的场景。","reading":"山水曲折后忽然出现村庄，接着是丰足的酒食和淳厚的人情。“柳暗花明”首先是行路中的真实惊喜，也因此能引发困境中重新看见希望的联想。","backgroundUrl":"https://www.guwendao.net/shiwenv_09294abb5f67.aspx"},{"n":19,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_58313be2d918.aspx","title":{"text":"江雪","pinyin":["jiāng","xuě"]},"author":{"text":"唐 · 柳宗元","pinyin":["táng","","","","liǔ","zōng","yuán"]},"body":{"text":"千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。","pinyin":["qiān","shān","niǎo","fēi","jué","","wàn","jìng","rén","zōng","miè","","","gū","zhōu","suō","lì","wēng","","dú","diào","hán","jiāng","xuě",""]},"variants":[],"quote":"孤舟蓑笠翁，独钓寒江雪。","background":"通常认为作于柳宗元因永贞革新失败而被贬永州期间，带有他处境孤独、意志坚守的意味。","reading":"“千山”“万径”把天地铺得极大，“孤舟”“独钓”又将视线收在一个人身上。漫天寒雪中的垂钓者，既可见孤寂，也可读出不随外界改变的清峻与坚持。","backgroundUrl":"https://www.guwendao.net/shiwenv_58313be2d918.aspx"},{"n":20,"group":"山水与田园","url":"https://www.guwendao.net/shiwenv_f6bd6356c843.aspx","title":{"text":"滁州西涧","pinyin":["chú","zhōu","xī","jiàn"]},"author":{"text":"唐 · 韦应物","pinyin":["táng","","","","wéi","yìng","wù"]},"body":{"text":"独怜幽草涧边生，上有黄鹂深树鸣。\n春潮带雨晚来急，野渡无人舟自横。","pinyin":["dú","lián","yōu","cǎo","jiàn","biān","shēng","","shàng","yǒu","huáng","lí","shēn","shù","míng","","","chūn","cháo","dài","yǔ","wǎn","lái","jí","","yě","dù","wú","rén","zhōu","zì","héng",""]},"variants":[],"quote":"春潮带雨晚来急，野渡无人舟自横。","background":"一般认为是韦应物任滁州刺史时游览西涧所作，写城西水边的幽静景色。","reading":"上半写幽草与黄鹂，下半忽转为晚雨急潮中的渡口。水势很急，空船却自在横着，动静形成微妙张力。可以先体会这幅画面的寂静与闲淡，再考虑其中的身世寄意。","backgroundUrl":"https://www.guwendao.net/shiwenv_f6bd6356c843.aspx"},{"n":21,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_720b46d38537.aspx","title":{"text":"次北固山下","pinyin":["cì","běi","gù","shān","xià"]},"author":{"text":"唐 · 王湾","pinyin":["táng","","","","wáng","wān"]},"body":{"text":"客路青山外，行舟绿水前。\n潮平两岸阔，风正一帆悬。\n海日生残夜，江春入旧年。\n乡书何处达，归雁洛阳边。","pinyin":["kè","lù","qīng","shān","wài","","xíng","zhōu","lǜ","shuǐ","qián","","","cháo","píng","liǎng","àn","kuò","","fēng","zhèng","yī","fān","xuán","","","hǎi","rì","shēng","cán","yè","","jiāng","chūn","rù","jiù","nián","","","xiāng","shū","hé","chù","dá","","guī","yàn","luò","yáng","biān",""]},"variants":[],"quote":"海日生残夜，江春入旧年。","background":"王湾行旅途中泊舟北固山下时所作，季节在冬末春初。北固山在今江苏镇江，“次”是停宿。","reading":"潮平、岸阔、顺风和高帆展开明朗江景，海日与江春又把时间写成新旧交替的过程。景色虽然开阔，结尾仍托归雁寄家书，落在旅人的乡愁上。","backgroundUrl":"https://www.guwendao.net/shiwenv_720b46d38537.aspx"},{"n":22,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_5775c79bcd34.aspx","title":{"text":"送杜少府之任蜀州","pinyin":["sòng","dù","shào","fǔ","zhī","rèn","shǔ","zhōu"]},"author":{"text":"唐 · 王勃","pinyin":["táng","","","","wáng","bó"]},"body":{"text":"城阙辅三秦，风烟望五津。\n与君离别意，同是宦游人。\n海内存知己，天涯若比邻。\n无为在歧路，儿女共沾巾。","pinyin":["chéng","què","fǔ","sān","qín","","fēng","yān","wàng","wǔ","jīn","","","yǔ","jūn","lí","bié","yì","","tóng","shì","huàn","yóu","rén","","","hǎi","nèi","cún","zhī","jǐ","","tiān","yá","ruò","bǐ","lín","","","wú","wéi","zài","qí","lù","","ér","nǚ","gòng","zhān","jīn",""]},"variants":[],"quote":"海内存知己，天涯若比邻。","background":"王勃在长安为一位姓杜、将赴蜀地任职的朋友送行。少府是县尉的称呼。","reading":"诗先拉开两地的空间距离，再以同为宦游人的处境彼此宽慰。“海内存知己”把友情放到更大的天地中，结尾劝友人坦然告别，显示初唐送别诗明朗开阔的一面。","backgroundUrl":"https://www.guwendao.net/shiwenv_5775c79bcd34.aspx"},{"n":23,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_12a2295aa76b.aspx","title":{"text":"送元二使安西","pinyin":["sòng","yuán","èr","shǐ","ān","xī"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"渭城朝雨浥轻尘，客舍青青柳色新。\n劝君更尽一杯酒，西出阳关无故人。","pinyin":["wèi","chéng","zhāo","yǔ","yì","qīng","chén","","kè","shè","qīng","qīng","liǔ","sè","xīn","","","quàn","jūn","gèng","jìn","yī","bēi","jiǔ","","xī","chū","yáng","guān","wú","gù","rén",""]},"variants":[],"quote":"劝君更尽一杯酒，西出阳关无故人。","background":"王维在渭城送元二出使安西时所作，后来被谱成《阳关三叠》，广为传唱。","reading":"清晨细雨洗净路尘，柳色更新，环境明亮，离别却更难割舍。最后只写劝友人再饮一杯，千言万语都压在这个动作里；越过阳关后的陌生路途，也使此刻格外珍贵。","backgroundUrl":"https://www.guwendao.net/shiwenv_12a2295aa76b.aspx"},{"n":24,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_d3f231047aef.aspx","title":{"text":"黄鹤楼送孟浩然之广陵","pinyin":["huáng","hè","lóu","sòng","mèng","hào","rán","zhī","guǎng","líng"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"故人西辞黄鹤楼，烟花三月下扬州。\n孤帆远影碧空尽，唯见长江天际流。","pinyin":["gù","rén","xī","cí","huáng","hè","lóu","","yān","huā","sān","yuè","xià","yáng","zhōu","","","gū","fān","yuǎn","yǐng","bì","kōng","jìn","","wéi","jiàn","cháng","jiāng","tiān","jì","liú",""]},"variants":["唯 通：惟"],"quote":"孤帆远影碧空尽，唯见长江天际流。","background":"李白在黄鹤楼送孟浩然乘船前往广陵，即今天的扬州。诗中的“烟花三月”点明江南春日。","reading":"前两句交代人物、地点和时节，后两句一直追随远去的帆影。直到船消失，江水仍流向天际；送行者站得多么久、情意有多深，都通过这段凝望表现出来。","backgroundUrl":"https://www.guwendao.net/shiwenv_d3f231047aef.aspx"},{"n":25,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_c348339f28fd.aspx","title":{"text":"送友人","pinyin":["sòng","yǒu","rén"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"青山横北郭，白水绕东城。\n此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。\n挥手自兹去，萧萧班马鸣。","pinyin":["qīng","shān","héng","běi","guō","","bái","shuǐ","rào","dōng","chéng","","","cǐ","dì","yī","wéi","bié","","gū","péng","wàn","lǐ","zhēng","","","fú","yún","yóu","zǐ","yì","","luò","rì","gù","rén","qíng","","","huī","shǒu","zì","zī","qù","","xiāo","xiāo","bān","mǎ","míng",""]},"variants":[],"quote":"浮云游子意，落日故人情。","background":"李白写友人离去的送别诗，具体作年和地点有不同说法。作品以城外相送的场景展开。","reading":"青山白水先构成清楚的送别地点，浮云与落日再分别映照游子的漂泊和故人的留恋。最后连马都仿佛不忍分别，景物与动作共同承担了难以说出口的情意。","backgroundUrl":"https://www.guwendao.net/shiwenv_c348339f28fd.aspx"},{"n":26,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_62280919c9c5.aspx","title":{"text":"闻王昌龄左迁龙标遥有此寄","pinyin":["wén","wáng","chāng","líng","zuǒ","qiān","lóng","biāo","yáo","yǒu","cǐ","jì"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"杨花落尽子规啼，闻道龙标过五溪。\n我寄愁心与明月，随君直到夜郎西。","pinyin":["yáng","huā","luò","jìn","zǐ","guī","tí","","wén","dào","lóng","biāo","guò","wǔ","xī","","","wǒ","jì","chóu","xīn","yǔ","míng","yuè","","suí","jūn","zhí","dào","yè","láng","xī",""]},"variants":["随君 一作：随风"],"quote":"我寄愁心与明月，随君直到夜郎西。","background":"李白听说王昌龄被贬为龙标尉后，写诗从远方寄去慰问。“左迁”即贬官。","reading":"杨花飘落、子规啼叫，使开头便带着漂泊与悲切。自己不能同行，就请明月带去牵挂；将抽象的“愁心”托付给可见的月亮，让遥远的关心变得具体。","backgroundUrl":"https://www.guwendao.net/shiwenv_62280919c9c5.aspx"},{"n":27,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_d50eb19399e6.aspx","title":{"text":"渡荆门送别","pinyin":["dù","jīng","mén","sòng","bié"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"渡远荆门外，来从楚国游。\n山随平野尽，江入大荒流。\n月下飞天镜，云生结海楼。\n仍怜故乡水，万里送行舟。","pinyin":["dù","yuǎn","jīng","mén","wài","","lái","cóng","chǔ","guó","yóu","","","shān","suí","píng","yě","jìn","","jiāng","rù","dà","huāng","liú","","","yuè","xià","fēi","tiān","jìng","","yún","shēng","jié","hǎi","lóu","","","réng","lián","gù","xiāng","shuǐ","","wàn","lǐ","sòng","xíng","zhōu",""]},"variants":[],"quote":"仍怜故乡水，万里送行舟。","background":"李白青年离开蜀地、经过荆门时所作。这里的送别包含对故乡的告别。","reading":"山势渐尽、平原展开，是乘舟出峡时视野不断变化的过程。诗人对新天地充满惊喜，结尾又把江水写成送自己的故乡亲人，使向往远方与留恋来处同时存在。","backgroundUrl":"https://www.guwendao.net/shiwenv_d50eb19399e6.aspx"},{"n":28,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_ad6f7cfa10c2.aspx","title":{"text":"月夜忆舍弟","pinyin":["yuè","yè","yì","shè","dì"]},"author":{"text":"唐 · 杜甫","pinyin":["táng","","","","dù","fǔ"]},"body":{"text":"戍鼓断人行，边秋一雁声。\n露从今夜白，月是故乡明。\n有弟皆分散，无家问死生。\n寄书长不达，况乃未休兵。","pinyin":["shù","gǔ","duàn","rén","xíng","","biān","qiū","yī","yàn","shēng","","","lù","cóng","jīn","yè","bái","","yuè","shì","gù","xiāng","míng","","","yǒu","dì","jiē","fēn","sàn","","wú","jiā","wèn","sǐ","shēng","","","jì","shū","cháng","bù","dá","","kuàng","nǎi","wèi","xiū","bīng",""]},"variants":["边秋 一作:秋边"],"quote":"露从今夜白，月是故乡明。","background":"安史之乱期间，杜甫客居秦州，兄弟分散、音讯难通。这首秋夜诗由此写出。","reading":"戍鼓、孤雁先点出战时的冷落，再由白露和明月转入思乡。“月是故乡明”说的是情感中的真实；后半写寄书难达，让团聚的愿望与战争的阻隔紧紧相连。","backgroundUrl":"https://www.guwendao.net/shiwenv_ad6f7cfa10c2.aspx"},{"n":29,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_e46c43d13b97.aspx","title":{"text":"夜雨寄北","pinyin":["yè","yǔ","jì","běi"]},"author":{"text":"唐 · 李商隐","pinyin":["táng","","","","lǐ","shāng","yǐn"]},"body":{"text":"君问归期未有期，巴山夜雨涨秋池。\n何当共剪西窗烛，却话巴山夜雨时。","pinyin":["jūn","wèn","guī","qī","wèi","yǒu","qī","","bā","shān","yè","yǔ","zhǎng","qiū","chí","","","hé","dāng","gòng","jiǎn","xī","chuāng","zhú","","què","huà","bā","shān","yè","yǔ","shí",""]},"variants":[],"quote":"何当共剪西窗烛，却话巴山夜雨时。","background":"李商隐旅居巴蜀时寄怀北方亲友的作品。收信人是妻子还是友人，存在不同说法。","reading":"开头回答归期却无法给出日期，只能写眼前不断上涨的秋雨。后半想象日后重聚时，一起谈起今夜；未来的温暖和当下的孤独叠在一起，使短诗有了往返的时间感。","backgroundUrl":"https://www.guwendao.net/shiwenv_e46c43d13b97.aspx"},{"n":30,"group":"送别与思乡","url":"https://www.guwendao.net/shiwenv_d75a706935de.aspx","title":{"text":"九月九日忆山东兄弟","pinyin":["jiǔ","yuè","jiǔ","rì","yì","shān","dōng","xiōng","dì"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"独在异乡为异客，每逢佳节倍思亲。\n遥知兄弟登高处，遍插茱萸少一人。","pinyin":["dú","zài","yì","xiāng","wéi","yì","kè","","měi","féng","jiā","jié","bèi","sī","qīn","","","yáo","zhī","xiōng","dì","dēng","gāo","chù","","biàn","chā","zhū","yú","shǎo","yī","rén",""]},"variants":[],"quote":"独在异乡为异客，每逢佳节倍思亲。","background":"王维年轻时客居外地，在重阳节思念故乡兄弟。“山东”在这里指华山以东，不能直接当作今天的山东省。","reading":"前两句直说异乡人的思亲，后两句却转到故乡一边：想象兄弟登高插茱萸时发现少了自己。从“我想他们”转成“他们也在想我”，感情因此更加深厚。","backgroundUrl":"https://www.guwendao.net/shiwenv_d75a706935de.aspx"},{"n":31,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_efec283b31e0.aspx","title":{"text":"望岳","pinyin":["wàng","yuè"]},"author":{"text":"唐 · 杜甫","pinyin":["táng","","","","dù","fǔ"]},"body":{"text":"岱宗夫如何？齐鲁青未了。\n造化钟神秀，阴阳割昏晓。\n荡胸生曾云，决眦入归鸟。\n会当凌绝顶，一览众山小。","pinyin":["dài","zōng","fú","rú","hé","","qí","lǔ","qīng","wèi","liǎo","","","zào","huà","zhōng","shén","xiù","","yīn","yáng","gē","hūn","xiǎo","","","dàng","xiōng","shēng","céng","yún","","jué","zì","rù","guī","niǎo","","","huì","dāng","líng","jué","dǐng","","yī","lǎn","zhòng","shān","xiǎo",""]},"variants":["曾 同：层"],"quote":"会当凌绝顶，一览众山小。","background":"杜甫青年漫游齐赵时望泰山所作。题为“望岳”，着重写仰望时的感受与未来登临的愿望。","reading":"泰山的绵延、阴阳变化、层云与归鸟，逐步推动视线和情绪向上。结尾由眼前观看变为一定要登顶的决心，山的高度与年轻人的抱负相互映照。","backgroundUrl":"https://www.guwendao.net/shiwenv_efec283b31e0.aspx"},{"n":32,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_870828ca8aaa.aspx","title":{"text":"行路难·其一","pinyin":["xíng","lù","nán","","qí","yī"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。","pinyin":["jīn","zūn","qīng","jiǔ","dǒu","shí","qiān","","yù","pán","zhēn","xiū","zhí","wàn","qián","","","tíng","bēi","tóu","zhù","bù","néng","shí","","bá","jiàn","sì","gù","xīn","máng","rán","","","yù","dù","huáng","hé","bīng","sè","chuān","","jiāng","dēng","tài","háng","xuě","mǎn","shān","","","xián","lái","chuí","diào","bì","xī","shàng","","hū","fù","chéng","zhōu","mèng","rì","biān","","","xíng","lù","nán","","xíng","lù","nán","","duō","qí","lù","","jīn","ān","zài","","","cháng","fēng","pò","làng","huì","yǒu","shí","","zhí","guà","yún","fān","jì","cāng","hǎi",""]},"variants":["羞 同：馐；直 同：值","雪满山 一作：雪暗天","碧 一作：坐"],"quote":"长风破浪会有时，直挂云帆济沧海。","background":"一般联系李白离开长安、仕途受挫时的经历来理解。“行路难”是乐府旧题，常借道路艰难写人生阻碍。","reading":"面对美酒佳肴却吃不下，拔剑四顾又找不到出路，情绪先陷入困顿。随后借古人际遇重新鼓起希望，直到乘风破浪的想象。读时要听见愤懑与自信之间的起伏。","backgroundUrl":"https://www.guwendao.net/shiwenv_870828ca8aaa.aspx"},{"n":33,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_4083a01ac833.aspx","title":{"text":"登幽州台歌","pinyin":["dēng","yōu","zhōu","tái","gē"]},"author":{"text":"唐 · 陈子昂","pinyin":["táng","","","","chén","zǐ","áng"]},"body":{"text":"前不见古人，后不见来者。\n念天地之悠悠，独怆然而涕下！","pinyin":["qián","bù","jiàn","gǔ","rén","","hòu","bù","jiàn","lái","zhě","","","niàn","tiān","dì","zhī","yōu","yōu","","dú","chuàng","rán","ér","tì","xià",""]},"variants":[],"quote":"念天地之悠悠，独怆然而涕下！","background":"陈子昂随军出征、进言受挫后登临幽州台，感慨自己的政治理想难以实现。","reading":"前两句把目光投向过去与未来，后两句转为天地之间孤独的自己。全诗没有细写楼台风景，却用时间的无尽和个人的有限，写出无人理解、无从施展的悲凉。","backgroundUrl":"https://www.guwendao.net/shiwenv_4083a01ac833.aspx"},{"n":34,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_c90ff9ea5a71.aspx","title":{"text":"登鹳雀楼","pinyin":["dēng","guàn","què","lóu"]},"author":{"text":"唐 · 王之涣","pinyin":["táng","","","","wáng","zhī","huàn"]},"body":{"text":"白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。","pinyin":["bái","rì","yī","shān","jìn","","huáng","hé","rù","hǎi","liú","","","yù","qióng","qiān","lǐ","mù","","gèng","shàng","yī","céng","lóu",""]},"variants":[],"quote":"欲穷千里目，更上一层楼。","background":"这是一首登楼望远的五言绝句，传统上署王之涣，所咏鹳雀楼在今山西永济一带。","reading":"落日依山、黄河入海，使视线横向与纵向展开；随后想看得更远，便再上一层。由真实登楼动作生发出的道理很自然：视野会随立足点的改变而改变。","backgroundUrl":"https://www.guwendao.net/shiwenv_c90ff9ea5a71.aspx"},{"n":35,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_f6c40e3d4893.aspx","title":{"text":"酬乐天扬州初逢席上见赠","pinyin":["chóu","lè","tiān","yáng","zhōu","chū","féng","xí","shàng","jiàn","zèng"]},"author":{"text":"唐 · 刘禹锡","pinyin":["táng","","","","liú","yǔ","xī"]},"body":{"text":"巴山楚水凄凉地，二十三年弃置身。\n怀旧空吟闻笛赋，到乡翻似烂柯人。\n沉舟侧畔千帆过，病树前头万木春。\n今日听君歌一曲，暂凭杯酒长精神。","pinyin":["bā","shān","chǔ","shuǐ","qī","liáng","dì","","èr","shí","sān","nián","qì","zhì","shēn","","","huái","jiù","kōng","yín","wén","dí","fù","","dào","xiāng","fān","sì","làn","kē","rén","","","chén","zhōu","cè","pàn","qiān","fān","guò","","bìng","shù","qián","tóu","wàn","mù","chūn","","","jīn","rì","tīng","jūn","gē","yī","qǔ","","zàn","píng","bēi","jiǔ","zhǎng","jīng","shén",""]},"variants":[],"quote":"沉舟侧畔千帆过，病树前头万木春。","background":"刘禹锡与白居易在扬州相逢，白居易席间赠诗感叹他的长期贬谪，刘禹锡作此诗回应。“乐天”是白居易的字。","reading":"诗先承认多年遭际的苦楚与人事变化，随后把视线转向千帆与万木的生机。结尾感谢友人的关切，并重新振作；名句的力量，来自它承接了前面的真实伤痛。","backgroundUrl":"https://www.guwendao.net/shiwenv_f6c40e3d4893.aspx"},{"n":36,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_4a272f472fee.aspx","title":{"text":"登飞来峰","pinyin":["dēng","fēi","lái","fēng"]},"author":{"text":"宋 · 王安石","pinyin":["sòng","","","","wáng","ān","shí"]},"body":{"text":"飞来山上千寻塔，闻说鸡鸣见日升。\n不畏浮云遮望眼，自缘身在最高层。","pinyin":["fēi","lái","shān","shàng","qiān","xún","tǎ","","wén","shuō","jī","míng","jiàn","rì","shēng","","","bù","wèi","fú","yún","zhē","wàng","yǎn","","zì","yuán","shēn","zài","zuì","gāo","céng",""]},"variants":["飞来山 一作：飞来峰"],"quote":"不畏浮云遮望眼，自缘身在最高层。","background":"王安石早年登临飞来峰时所作，写高处远眺的感受，也寄托了自己的志向。","reading":"高塔、鸡鸣与日出先抬高视点，后两句由登高转为思考：站得高，便更能越过眼前遮挡。“浮云”既是景物，也可以读作妨碍判断与前行的阻力。","backgroundUrl":"https://www.guwendao.net/shiwenv_4a272f472fee.aspx"},{"n":37,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_f2f5469a6044.aspx","title":{"text":"题西林壁","pinyin":["tí","xī","lín","bì"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"横看成岭侧成峰，远近高低各不同。\n不识庐山真面目，只缘身在此山中。","pinyin":["héng","kàn","chéng","lǐng","cè","chéng","fēng","","yuǎn","jìn","gāo","dī","gè","bù","tóng","","","bù","shí","lú","shān","zhēn","miàn","mù","","zhǐ","yuán","shēn","zài","cǐ","shān","zhōng",""]},"variants":[],"quote":"不识庐山真面目，只缘身在此山中。","background":"苏轼离开黄州、途经庐山时游山题壁所作，题写地点是西林寺。","reading":"同一座山，横看、侧看、远近高低看，都呈现不同形貌。结尾把游山经验转成认识问题：身处局部会限制对整体的判断。诗中的道理由观看的变化一步步生出。","backgroundUrl":"https://www.guwendao.net/shiwenv_f2f5469a6044.aspx"},{"n":38,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_4c1364cb1da5.aspx","title":{"text":"观书有感·其一","pinyin":["guān","shū","yǒu","gǎn","","qí","yī"]},"author":{"text":"宋 · 朱熹","pinyin":["sòng","","","","zhū","xī"]},"body":{"text":"半亩方塘一鉴开，天光云影共徘徊。\n问渠那得清如许？为有源头活水来。","pinyin":["bàn","mǔ","fāng","táng","yī","jiàn","kāi","","tiān","guāng","yún","yǐng","gòng","pái","huái","","","wèn","qú","nǎ","dé","qīng","rú","xǔ","","wèi","yǒu","yuán","tóu","huó","shuǐ","lái",""]},"variants":["那 通：哪"],"quote":"问渠那得清如许？为有源头活水来。","background":"朱熹借景物写读书体会的组诗之一。具体作年与地点有不同说法，理解时可以紧扣题目与池塘的比喻。","reading":"半亩池塘像镜子一样清澈，能映出天空和云影，因为持续有活水流入。联系读书，意思是心智要保持清明，也需要不断学习与思考，让新的理解进入其中。","backgroundUrl":"https://www.guwendao.net/shiwenv_4c1364cb1da5.aspx"},{"n":39,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_c6c93895df0a.aspx","title":{"text":"石灰吟","pinyin":["shí","huī","yín"]},"author":{"text":"明 · 于谦","pinyin":["míng","","","","yú","qiān"]},"body":{"text":"千锤万凿出深山，烈火焚烧若等闲。\n粉骨碎身浑不怕，要留清白在人间。","pinyin":["qiān","chuí","wàn","záo","chū","shēn","shān","","liè","huǒ","fén","shāo","ruò","děng","xián","","","fěn","gǔ","suì","shēn","hún","bù","pà","","yào","liú","qīng","bái","zài","rén","jiān",""]},"variants":["万凿 一作：万击","浑不怕 一作：全不怕"],"quote":"粉骨碎身浑不怕，要留清白在人间。","background":"于谦的咏物言志诗，以石灰表达对人格的要求。关于他少年观看烧石灰而作诗的故事，属于流传的说法。","reading":"石灰经历开凿、烈火和粉碎，最后留下洁白。“清白”同时指物的颜色与人的操守，层层磨炼也因此有了人格意味；关键在于受尽考验仍守住所认定的价值。","backgroundUrl":"https://www.guwendao.net/shiwenv_c6c93895df0a.aspx"},{"n":40,"group":"抱负与人生感怀","url":"https://www.guwendao.net/shiwenv_d78d2dc95f06.aspx","title":{"text":"己亥杂诗·其五","pinyin":["jǐ","hài","zá","shī","","qí","wǔ"]},"author":{"text":"清 · 龚自珍","pinyin":["qīng","","","","gōng","zì","zhēn"]},"body":{"text":"浩荡离愁白日斜，吟鞭东指即天涯。\n落红不是无情物，化作春泥更护花。","pinyin":["hào","dàng","lí","chóu","bái","rì","xié","","yín","biān","dōng","zhǐ","jí","tiān","yá","","","luò","hóng","bù","shì","wú","qíng","wù","","huà","zuò","chūn","ní","gèng","hù","huā",""]},"variants":[],"quote":"落红不是无情物，化作春泥更护花。","background":"龚自珍在己亥年，即1839年辞官离京、南归途中写下大量诗篇，此为组诗中的第五首。","reading":"离京时的愁绪与远去的马鞭写出告别，后两句却让落花变成滋养新花的春泥。诗人借此表达：即使离开原来的位置，仍愿继续贡献力量。","backgroundUrl":"https://www.guwendao.net/shiwenv_d78d2dc95f06.aspx"},{"n":41,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_89d3a63c6d7f.aspx","title":{"text":"春望","pinyin":["chūn","wàng"]},"author":{"text":"唐 · 杜甫","pinyin":["táng","","","","dù","fǔ"]},"body":{"text":"国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。","pinyin":["guó","pò","shān","hé","zài","","chéng","chūn","cǎo","mù","shēn","","","gǎn","shí","huā","jiàn","lèi","","hèn","bié","niǎo","jīng","xīn","","","fēng","huǒ","lián","sān","yuè","","jiā","shū","dǐ","wàn","jīn","","","bái","tóu","sāo","gèng","duǎn","","hún","yù","bù","shèng","zān",""]},"variants":[],"quote":"烽火连三月，家书抵万金。","background":"安史之乱中，杜甫被困在叛军占领的长安，写下这首暮春之作。家人与他分离，通信十分困难。","reading":"山河仍在，城池却荒芜；春天的花鸟反而触发悲痛。家国之忧和思亲之情逐层收紧，最后落在白发与簪子的小动作上，把巨大的动荡写进一个人的身体。","backgroundUrl":"https://www.guwendao.net/shiwenv_89d3a63c6d7f.aspx"},{"n":42,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_eeb217f8cb2d.aspx","title":{"text":"登高","pinyin":["dēng","gāo"]},"author":{"text":"唐 · 杜甫","pinyin":["táng","","","","dù","fǔ"]},"body":{"text":"风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。","pinyin":["fēng","jí","tiān","gāo","yuán","xiào","āi","","zhǔ","qīng","shā","bái","niǎo","fēi","huí","","","wú","biān","luò","mù","xiāo","xiāo","xià","","bù","jìn","cháng","jiāng","gǔn","gǔn","lái","","","wàn","lǐ","bēi","qiū","cháng","zuò","kè","","bǎi","nián","duō","bìng","dú","dēng","tái","","","jiān","nán","kǔ","hèn","fán","shuāng","bìn","","liáo","dǎo","xīn","tíng","zhuó","jiǔ","bēi",""]},"variants":[],"quote":"无边落木萧萧下，不尽长江滚滚来。","background":"通常认为写于杜甫晚年寓居夔州之时。长期漂泊、年老多病，使登高所见的秋景与身世之感交织。","reading":"前半从风、猿、鸟写到无边落叶与不尽江水，空间辽阔、时间流逝；后半转到万里作客、独自登台的自己。严整的对仗把多重悲苦压在一起，形成沉重而有节奏的力量。","backgroundUrl":"https://www.chinakongzi.org/kzsf/wxxs/zuozhe/dufu/200705/t20070525_30717.htm"},{"n":43,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_b0d3f72465ef.aspx","title":{"text":"黄鹤楼","pinyin":["huáng","hè","lóu"]},"author":{"text":"唐 · 崔颢","pinyin":["táng","","","","cuī","hào"]},"body":{"text":"昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。","pinyin":["xī","rén","yǐ","chéng","huáng","hè","qù","","cǐ","dì","kōng","yú","huáng","hè","lóu","","","huáng","hè","yī","qù","bù","fù","fǎn","","bái","yún","qiān","zǎi","kōng","yōu","yōu","","","qíng","chuān","lì","lì","hàn","yáng","shù","","fāng","cǎo","qī","qī","yīng","wǔ","zhōu","","","rì","mù","xiāng","guān","hé","chù","shì","","yān","bō","jiāng","shàng","shǐ","rén","chóu",""]},"variants":[],"quote":"日暮乡关何处是？烟波江上使人愁。","background":"崔颢登临黄鹤楼时触景生情，以仙人乘鹤的传说开篇，逐渐转入登楼者的现实感受。","reading":"黄鹤已去、白云悠悠，将人引向遥远的时间；晴川芳草又把视线拉回眼前。日暮时忽然追问故乡在何处，辽阔江景于是染上乡愁，情绪在结尾完成转折。","backgroundUrl":"https://www.guwendao.net/shiwenv_b0d3f72465ef.aspx"},{"n":44,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_eae647c5c110.aspx","title":{"text":"使至塞上","pinyin":["shǐ","zhì","sài","shàng"]},"author":{"text":"唐 · 王维","pinyin":["táng","","","","wáng","wéi"]},"body":{"text":"单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。","pinyin":["dān","chē","yù","wèn","biān","","shǔ","guó","guò","jū","yán","","","zhēng","péng","chū","hàn","sài","","guī","yàn","rù","hú","tiān","","","dà","mò","gū","yān","zhí","","cháng","hé","luò","rì","yuán","","","xiāo","guān","féng","hòu","qí","","dū","hù","zài","yān","rán",""]},"variants":[],"quote":"大漠孤烟直，长河落日圆。","background":"王维奉命出使边塞、前往西北途中所作。诗中既写沿途所见，也写出使者的孤独感。","reading":"征蓬、归雁映照身不由己的远行，接着突然展开大漠、长河、孤烟与落日。“直”与“圆”使景物简洁有力，开阔的边地景象也将个人心绪放进更大的天地。","backgroundUrl":"https://www.guwendao.net/shiwenv_eae647c5c110.aspx"},{"n":45,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_b9e14c6e09aa.aspx","title":{"text":"出塞·其一","pinyin":["chū","sài","","qí","yī"]},"author":{"text":"唐 · 王昌龄","pinyin":["táng","","","","wáng","chāng","líng"]},"body":{"text":"秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。","pinyin":["qín","shí","míng","yuè","hàn","shí","guān","","wàn","lǐ","cháng","zhēng","rén","wèi","huán","","","dàn","shǐ","lóng","chéng","fēi","jiàng","zài","","bù","jiào","hú","mǎ","dù","yīn","shān",""]},"variants":[],"quote":"但使龙城飞将在，不教胡马度阴山。","background":"王昌龄沿用乐府旧题写成的边塞诗，关注久戍不归的士卒与边防将才的问题。","reading":"秦汉的明月与关塞把长期战争浓缩在一句中。后两句期盼能守护边境的良将，既有御敌的愿望，也有对战争不断、征人难返的痛惜。“龙城飞将”所指历来有不同解释。","backgroundUrl":"https://www.guwendao.net/shiwenv_b9e14c6e09aa.aspx"},{"n":46,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_a60e7fd3031b.aspx","title":{"text":"雁门太守行","pinyin":["yàn","mén","tài","shǒu","xíng"]},"author":{"text":"唐 · 李贺","pinyin":["táng","","","","lǐ","hè"]},"body":{"text":"黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，塞上燕脂凝夜紫。\n半卷红旗临易水，霜重鼓寒声不起。\n报君黄金台上意，提携玉龙为君死。","pinyin":["hēi","yún","yā","chéng","chéng","yù","cuī","","jiǎ","guāng","xiàng","rì","jīn","lín","kāi","","","jiǎo","shēng","mǎn","tiān","qiū","sè","lǐ","","sài","shàng","yān","zhī","níng","yè","zǐ","","","bàn","juǎn","hóng","qí","lín","yì","shuǐ","","shuāng","zhòng","gǔ","hán","shēng","bù","qǐ","","","bào","jūn","huáng","jīn","tái","shàng","yì","","tí","xié","yù","lóng","wèi","jūn","sǐ",""]},"variants":["塞上 一作：塞土"],"quote":"黑云压城城欲摧，甲光向日金鳞开。","background":"李贺用乐府旧题写战争场面，具体作年与所对应的战事有不同说法，适合先作为艺术化的边塞想象来读。","reading":"黑云、金甲、燕脂、紫塞等浓烈颜色，与号角、战鼓交织，形成紧迫而悲壮的战场。最后以黄金台的典故写将士报答知遇的决心，情绪从危急推向誓死奋战。","backgroundUrl":"https://www.guwendao.net/shiwenv_a60e7fd3031b.aspx"},{"n":47,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_3fb397218a1e.aspx","title":{"text":"赤壁","pinyin":["chì","bì"]},"author":{"text":"唐 · 杜牧","pinyin":["táng","","","","dù","mù"]},"body":{"text":"折戟沉沙铁未销，自将磨洗认前朝。\n东风不与周郎便，铜雀春深锁二乔。","pinyin":["zhé","jǐ","chén","shā","tiě","wèi","xiāo","","zì","jiāng","mó","xǐ","rèn","qián","cháo","","","dōng","fēng","bù","yǔ","zhōu","láng","biàn","","tóng","què","chūn","shēn","suǒ","èr","qiáo",""]},"variants":[],"quote":"东风不与周郎便，铜雀春深锁二乔。","background":"杜牧由赤壁遗迹联想到三国战争，写成这首咏史绝句。诗借古人的成败思考历史中的机遇。","reading":"从一支折戟认出旧事，再设想如果没有东风，结局可能完全不同。末句以二乔的命运暗示东吴的命运，用小处写大事，也让读者重新思考英雄功业与时势的关系。","backgroundUrl":"https://www.guwendao.net/shiwenv_3fb397218a1e.aspx"},{"n":48,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_8e8011f614fb.aspx","title":{"text":"泊秦淮","pinyin":["bó","qín","huái"]},"author":{"text":"唐 · 杜牧","pinyin":["táng","","","","dù","mù"]},"body":{"text":"烟笼寒水月笼沙，夜泊秦淮近酒家。\n商女不知亡国恨，隔江犹唱后庭花。","pinyin":["yān","lǒng","hán","shuǐ","yuè","lǒng","shā","","yè","bó","qín","huái","jìn","jiǔ","jiā","","","shāng","nǚ","bù","zhī","wáng","guó","hèn","","gé","jiāng","yóu","chàng","hòu","tíng","huā",""]},"variants":[],"quote":"商女不知亡国恨，隔江犹唱后庭花。","background":"杜牧夜泊秦淮河，听到《玉树后庭花》而联想到陈朝覆亡。这种感慨也与他对晚唐局势的忧虑相连。","reading":"烟、水、月、沙构成朦胧夜景，歌声却把历史的警告带入眼前。诗面上写歌女，批评所指也包含沉迷歌舞的听众与权贵：旧日败亡的教训，仍未被认真记取。","backgroundUrl":"https://www.guwendao.net/shiwenv_8e8011f614fb.aspx"},{"n":49,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_5796865dca4a.aspx","title":{"text":"过零丁洋","pinyin":["guò","líng","dīng","yáng"]},"author":{"text":"宋 · 文天祥","pinyin":["sòng","","","","wén","tiān","xiáng"]},"body":{"text":"辛苦遭逢起一经，干戈寥落四周星。\n山河破碎风飘絮，身世浮沉雨打萍。\n惶恐滩头说惶恐，零丁洋里叹零丁。\n人生自古谁无死？留取丹心照汗青。","pinyin":["xīn","kǔ","zāo","féng","qǐ","yī","jīng","","gān","gē","liáo","luò","sì","zhōu","xīng","","","shān","hé","pò","suì","fēng","piāo","xù","","shēn","shì","fú","chén","yǔ","dǎ","píng","","","huáng","kǒng","tān","tóu","shuō","huáng","kǒng","","líng","dīng","yáng","lǐ","tàn","líng","dīng","","","rén","shēng","zì","gǔ","shuí","wú","sǐ","","liú","qǔ","dān","xīn","zhào","hàn","qīng",""]},"variants":[],"quote":"人生自古谁无死？留取丹心照汗青。","background":"文天祥抗元兵败被俘后经过零丁洋时所作。面对劝降，他以诗表达自己的选择。","reading":"前半回顾从入仕到战争失败的经历，又用地名双关写出惶恐与孤独。结尾从个人遭际中挺立起来，将能否保全生命的问题转向怎样留下气节，语气因此格外坚定。","backgroundUrl":"https://www.guwendao.net/shiwenv_5796865dca4a.aspx"},{"n":50,"group":"家国与怀古","url":"https://www.guwendao.net/shiwenv_1bd53945715b.aspx","title":{"text":"山坡羊·潼关怀古","pinyin":["shān","pō","yáng","","tóng","guān","huái","gǔ"]},"author":{"text":"元 · 张养浩","pinyin":["yuán","","","","zhāng","yǎng","hào"]},"body":{"text":"峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。\n伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。","pinyin":["fēng","luán","rú","jù","","bō","tāo","rú","nù","","shān","hé","biǎo","lǐ","tóng","guān","lù","","wàng","xī","dū","","yì","chóu","chú","","","shāng","xīn","qín","hàn","jīng","xíng","chù","","gōng","què","wàn","jiān","dōu","zuò","le","tǔ","","xīng","","bǎi","xìng","kǔ","","wáng","","bǎi","xìng","kǔ",""]},"variants":["踌躇 一作：踟蹰"],"quote":"兴，百姓苦；亡，百姓苦！","background":"张养浩赴陕西赈灾、经过潼关时所作，是一首元代散曲。眼前灾民的处境影响了他看待历史的方式。","reading":"峰峦与黄河先写潼关形势险要，继而转到王朝宫阙化为尘土。结尾把关注点从帝王胜败移到百姓身上：建造与征战的代价，往往由普通人承担。","backgroundUrl":"https://www.guwendao.net/shiwenv_1bd53945715b.aspx"},{"n":51,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_1921957e6e83.aspx","title":{"text":"锦瑟","pinyin":["jǐn","sè"]},"author":{"text":"唐 · 李商隐","pinyin":["táng","","","","lǐ","shāng","yǐn"]},"body":{"text":"锦瑟无端五十弦，一弦一柱思华年。\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n沧海月明珠有泪，蓝田日暖玉生烟。\n此情可待成追忆，只是当时已惘然。","pinyin":["jǐn","sè","wú","duān","wǔ","shí","xián","","yī","xián","yī","zhù","sī","huá","nián","","","zhuāng","shēng","xiǎo","mèng","mí","hú","dié","","wàng","dì","chūn","xīn","tuō","dù","juān","","","cāng","hǎi","yuè","míng","zhū","yǒu","lèi","","lán","tián","rì","nuǎn","yù","shēng","yān","","","cǐ","qíng","kě","dài","chéng","zhuī","yì","","zhǐ","shì","dāng","shí","yǐ","wǎng","rán",""]},"variants":[],"quote":"此情可待成追忆？只是当时已惘然。","background":"李商隐以首句中的“锦瑟”为题。作品究竟侧重悼亡、爱情还是身世感慨，历来没有一致解释。","reading":"庄周梦蝶、望帝托鹃、沧海珠泪、蓝田玉烟，构成几组美丽而难以把握的意象。它们共同指向往事的珍贵与迷惘；可以顺着情绪读，不必强行为每个典故指定一个现实人物。","backgroundUrl":"https://www.guwendao.net/shiwenv_1921957e6e83.aspx"},{"n":52,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_1a4c484f9364.aspx","title":{"text":"无题·相见时难别亦难","pinyin":["wú","tí","","xiāng","jiàn","shí","nán","bié","yì","nán"]},"author":{"text":"唐 · 李商隐","pinyin":["táng","","","","lǐ","shāng","yǐn"]},"body":{"text":"相见时难别亦难，东风无力百花残。\n春蚕到死丝方尽，蜡炬成灰泪始干。\n晓镜但愁云鬓改，夜吟应觉月光寒。\n蓬山此去无多路，青鸟殷勤为探看。","pinyin":["xiāng","jiàn","shí","nán","bié","yì","nán","","dōng","fēng","wú","lì","bǎi","huā","cán","","","chūn","cán","dào","sǐ","sī","fāng","jìn","","là","jù","chéng","huī","lèi","shǐ","gān","","","xiǎo","jìng","dàn","chóu","yún","bìn","gǎi","","yè","yín","yīng","jué","yuè","guāng","hán","","","péng","shān","cǐ","qù","wú","duō","lù","","qīng","niǎo","yīn","qín","wèi","tàn","kàn",""]},"variants":["蓬山 一作：蓬莱"],"quote":"春蚕到死丝方尽，蜡炬成灰泪始干。","background":"李商隐多首无题诗中的名篇，常按相思与离别来理解；具体人物关系及是否另有寄托，存在不同意见。","reading":"从相见不易、分别难舍，写到生命不息的牵挂，再想象对方的清晨与夜晚。春蚕、蜡炬把感情的消耗写得可见，结尾仍托青鸟传讯，保留一线难以放下的希望。","backgroundUrl":"https://www.guwendao.net/shiwenv_1a4c484f9364.aspx"},{"n":53,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_3574610d74e0.aspx","title":{"text":"虞美人·春花秋月何时了","pinyin":["yú","měi","rén","","chūn","huā","qiū","yuè","hé","shí","liǎo"]},"author":{"text":"五代 · 李煜","pinyin":["wǔ","dài","","","","lǐ","yù"]},"body":{"text":"春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。问君能有几多愁，恰似一江春水向东流。","pinyin":["chūn","huā","qiū","yuè","hé","shí","liǎo","","wǎng","shì","zhī","duō","shǎo","","xiǎo","lóu","zuó","yè","yòu","dōng","fēng","","gù","guó","bù","kān","huí","shǒu","yuè","míng","zhōng","","","diāo","lán","yù","qì","yīng","yóu","zài","","zhǐ","shì","zhū","yán","gǎi","","wèn","jūn","néng","yǒu","jǐ","duō","chóu","","qià","sì","yī","jiāng","chūn","shuǐ","xiàng","dōng","liú",""]},"variants":["栏 一作：阑"],"quote":"问君能有几多愁？恰似一江春水向东流。","background":"一般认为写于南唐灭亡、李煜降宋后居于汴京的时期。昔日君主的身份与旧日生活都已失去。","reading":"春花秋月本应美好，却因为不断唤起往事而令人难以承受。词中几次发问，从回忆故国推向无穷哀愁；结尾以江水写愁的流动与不尽，把抽象情绪变得有形。","backgroundUrl":"https://www.guwendao.net/shiwenv_3574610d74e0.aspx"},{"n":54,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_804144e6b0dd.aspx","title":{"text":"相见欢·无言独上西楼","pinyin":["xiāng","jiàn","huān","","wú","yán","dú","shàng","xī","lóu"]},"author":{"text":"五代 · 李煜","pinyin":["wǔ","dài","","","","lǐ","yù"]},"body":{"text":"无言独上西楼，月如钩。寂寞梧桐深院锁清秋。\n剪不断，理还乱，是离愁。别是一般滋味在心头。","pinyin":["wú","yán","dú","shàng","xī","lóu","","yuè","rú","gōu","","jì","mò","wú","tóng","shēn","yuàn","suǒ","qīng","qiū","","","jiǎn","bù","duàn","","lǐ","hái","luàn","","shì","lí","chóu","","bié","shì","yī","bān","zī","wèi","zài","xīn","tóu",""]},"variants":["一般 一作：一番"],"quote":"剪不断，理还乱，是离愁。","background":"通常联系李煜亡国后在汴京的生活来读，是他书写孤独与离愁的代表作。","reading":"无言独上西楼，月钩、梧桐和深院逐渐围出清冷的空间。后半将愁绪比作剪不断、理不清的丝线，最后仍说难以命名，表现出复杂情感超出语言的部分。","backgroundUrl":"https://www.guwendao.net/shiwenv_804144e6b0dd.aspx"},{"n":55,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_eda29e11ff49.aspx","title":{"text":"浣溪沙·一曲新词酒一杯","pinyin":["huàn","xī","shā","","yī","qǔ","xīn","cí","jiǔ","yī","bēi"]},"author":{"text":"宋 · 晏殊","pinyin":["sòng","","","","yàn","shū"]},"body":{"text":"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。小园香径独徘徊。","pinyin":["yī","qǔ","xīn","cí","jiǔ","yī","bēi","","qù","nián","tiān","qì","jiù","tíng","tái","","xī","yáng","xī","xià","jǐ","shí","huí","","","wú","kě","nài","hé","huā","luò","qù","","sì","céng","xiāng","shí","yàn","guī","lái","","xiǎo","yuán","xiāng","jìng","dú","pái","huái",""]},"variants":[],"quote":"无可奈何花落去，似曾相识燕归来。","background":"晏殊以饮酒听曲、春日庭院为场景，写对时光流逝的感受，是北宋小令的代表作品。","reading":"眼前天气与旧亭台似乎没有变，人却无法让昨天回来。落花令人无奈，归燕又带来熟悉的感觉，一失一得之间，伤春、怀旧和对生命循环的体会交织在一起。","backgroundUrl":"https://www.guwendao.net/shiwenv_eda29e11ff49.aspx"},{"n":56,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_e83cadaaf394.aspx","title":{"text":"鹊桥仙·纤云弄巧","pinyin":["què","qiáo","xiān","","xiān","yún","nòng","qiǎo"]},"author":{"text":"宋 · 秦观","pinyin":["sòng","","","","qín","guān"]},"body":{"text":"纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路！两情若是久长时，又岂在朝朝暮暮。","pinyin":["xiān","yún","nòng","qiǎo","","fēi","xīng","chuán","hèn","","yín","hàn","tiáo","tiáo","àn","dù","","jīn","fēng","yù","lù","yī","xiāng","féng","","biàn","shèng","què","rén","jiān","wú","shù","","","róu","qíng","sì","shuǐ","","jiā","qī","rú","mèng","","rěn","gù","què","qiáo","guī","lù","","liǎng","qíng","ruò","shì","jiǔ","cháng","shí","","yòu","qǐ","zài","zhāo","zhāo","mù","mù",""]},"variants":[],"quote":"两情若是久长时，又岂在朝朝暮暮。","background":"秦观借七夕牛郎织女相会的传说咏写爱情。关于具体寄赠对象，有不同的考证说法。","reading":"上片写短暂相逢的珍贵，下片写离别的柔情，最后提出对长久关系的理解。读名句时要连着前面的相聚与不舍，才能看见它对距离与时间的回应。","backgroundUrl":"https://www.guwendao.net/shiwenv_e83cadaaf394.aspx"},{"n":57,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_b7f6fef5bb0b.aspx","title":{"text":"一剪梅·红藕香残玉簟秋","pinyin":["yī","jiǎn","méi","","hóng","ǒu","xiāng","cán","yù","diàn","qiū"]},"author":{"text":"宋 · 李清照","pinyin":["sòng","","","","lǐ","qīng","zhào"]},"body":{"text":"红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。","pinyin":["hóng","ǒu","xiāng","cán","yù","diàn","qiū","","qīng","jiě","luó","cháng","","dú","shàng","lán","zhōu","","yún","zhōng","shuí","jì","jǐn","shū","lái","","yàn","zì","huí","shí","","yuè","mǎn","xī","lóu","","","huā","zì","piāo","líng","shuǐ","zì","liú","","yī","zhǒng","xiāng","sī","","liǎng","chù","xián","chóu","","cǐ","qíng","wú","jì","kě","xiāo","chú","","cái","xià","méi","tóu","","què","shàng","xīn","tóu",""]},"variants":[],"quote":"此情无计可消除，才下眉头，却上心头。","background":"通常视为李清照前期的怀人之作，常联系与丈夫分离的情境来读；“新婚题帕相赠”的故事并不可靠。","reading":"荷花衰残、竹席生凉，先把秋意写到身体感受上。随后由独自泛舟、等待书信转入相思。“才下眉头，却上心头”用内外位置的转换，写出愁绪难以排遣。","backgroundUrl":"https://www.guwendao.net/shiwenv_b7f6fef5bb0b.aspx"},{"n":58,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_f82821b9d569.aspx","title":{"text":"声声慢·寻寻觅觅","pinyin":["shēng","shēng","màn","","xún","xún","mì","mì"]},"author":{"text":"宋 · 李清照","pinyin":["sòng","","","","lǐ","qīng","zhào"]},"body":{"text":"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑！梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！","pinyin":["xún","xún","mì","mì","","lěng","lěng","qīng","qīng","","qī","qī","cǎn","cǎn","qī","qī","","zhà","nuǎn","huán","hán","shí","hòu","","zuì","nán","jiāng","xī","","sān","bēi","liǎng","zhǎn","dàn","jiǔ","","zěn","dí","tā","","wǎn","lái","fēng","jí","","yàn","guò","yě","","zhèng","shāng","xīn","","què","shì","jiù","shí","xiāng","shí","","","mǎn","dì","huáng","huā","duī","jī","","qiáo","cuì","sǔn","","rú","jīn","yǒu","shuí","kān","zhāi","","shǒu","zhe","chuāng","ér","","dú","zì","zěn","shēng","dé","hēi","","wú","tóng","gèng","jiān","xì","yǔ","","dào","huáng","hūn","","diǎn","diǎn","dī","dī","","zhè","cì","dì","","zěn","yī","gè","chóu","zì","liǎo","dé",""]},"variants":["守着窗儿 一作：守著窗儿"],"quote":"这次第，怎一个愁字了得！","background":"通常结合李清照南渡后流离、丧偶的经历理解此词，具体写作时间仍有争议。","reading":"连续叠词先写无所依凭的状态，再由淡酒、急风、过雁、黄花和梧桐细雨层层加深。结尾说一个“愁”字还不够，正因为这种痛苦已包含孤独、回忆与失落的多重重量。","backgroundUrl":"https://www.guwendao.net/shiwenv_f82821b9d569.aspx"},{"n":59,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_324219410b89.aspx","title":{"text":"醉花阴·薄雾浓云愁永昼","pinyin":["zuì","huā","yīn","","bó","wù","nóng","yún","chóu","yǒng","zhòu"]},"author":{"text":"宋 · 李清照","pinyin":["sòng","","","","lǐ","qīng","zhào"]},"body":{"text":"薄雾浓云愁永昼，瑞脑销金兽。佳节又重阳，玉枕纱厨，半夜凉初透。\n东篱把酒黄昏后，有暗香盈袖。莫道不销魂，帘卷西风，人比黄花瘦。","pinyin":["bó","wù","nóng","yún","chóu","yǒng","zhòu","","ruì","nǎo","xiāo","jīn","shòu","","jiā","jié","yòu","chóng","yáng","","yù","zhěn","shā","chú","","bàn","yè","liáng","chū","tòu","","","dōng","lí","bǎ","jiǔ","huáng","hūn","hòu","","yǒu","àn","xiāng","yíng","xiù","","mò","dào","bù","xiāo","hún","","lián","juǎn","xī","fēng","","rén","bǐ","huáng","huā","shòu",""]},"variants":["销金兽 一作：消金兽","销魂 一作：消魂；人比 一作：人似"],"quote":"莫道不销魂，帘卷西风，人比黄花瘦。","background":"李清照的重阳怀人词，通常联系她与赵明诚分离时的生活来理解。","reading":"白昼漫长、夜半生凉、东篱饮酒，节日里的每个时段都被相思填满。结尾让人与菊花相对照，“瘦”既是形体，也是情绪的外显，秋风中一瞬的画面因而十分动人。","backgroundUrl":"https://www.guwendao.net/shiwenv_324219410b89.aspx"},{"n":60,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_0a4d69889c65.aspx","title":{"text":"长相思·山一程","pinyin":["cháng","xiāng","sī","","shān","yī","chéng"]},"author":{"text":"清 · 纳兰性德","pinyin":["qīng","","","","nà","lán","xìng","dé"]},"body":{"text":"山一程，水一程，身向榆关那畔行，夜深千帐灯。\n风一更，雪一更，聒碎乡心梦不成，故园无此声。","pinyin":["shān","yī","chéng","","shuǐ","yī","chéng","","shēn","xiàng","yú","guān","nà","pàn","xíng","","yè","shēn","qiān","zhàng","dēng","","","fēng","yī","gēng","","xuě","yī","gēng","","guō","suì","xiāng","xīn","mèng","bù","chéng","","gù","yuán","wú","cǐ","shēng",""]},"variants":[],"quote":"聒碎乡心梦不成，故园无此声。","background":"纳兰性德随康熙帝出关东巡途中所作，行军驻宿的经历触发了对家乡的思念。","reading":"山水一程接一程，风雪一更接一更，重复句式分别拉长路途和夜晚。营帐千灯显出队伍之大，却衬出个人无法入梦的孤独；故园在记忆中成为安宁的对照。","backgroundUrl":"https://www.guwendao.net/shiwenv_0a4d69889c65.aspx"},{"n":61,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_3ffd5d0653a9.aspx","title":{"text":"如梦令·昨夜雨疏风骤","pinyin":["rú","mèng","lìng","","zuó","yè","yǔ","shū","fēng","zhòu"]},"author":{"text":"宋 · 李清照","pinyin":["sòng","","","","lǐ","qīng","zhào"]},"body":{"text":"昨夜雨疏风骤，浓睡不消残酒。试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。","pinyin":["zuó","yè","yǔ","shū","fēng","zhòu","","nóng","shuì","bù","xiāo","cán","jiǔ","","shì","wèn","juǎn","lián","rén","","què","dào","hǎi","táng","yī","jiù","","zhī","fǒu","","zhī","fǒu","","yīng","shì","lǜ","féi","hóng","shòu",""]},"variants":[],"quote":"知否，知否？应是绿肥红瘦。","background":"李清照早期词作，以一场风雨后的晨起问答写惜春之情。海棠是对话的中心。","reading":"侍女只说花依旧，词人却敏感地想到叶盛花衰。“绿肥红瘦”以颜色代叶花，再用人的体态词写变化，既俏皮准确，也透露出对美好时光消逝的在意。","backgroundUrl":"https://www.guwendao.net/shiwenv_3ffd5d0653a9.aspx"},{"n":62,"group":"相思与惜别","url":"https://www.guwendao.net/shiwenv_4d795944b856.aspx","title":{"text":"雨霖铃·寒蝉凄切","pinyin":["yǔ","lín","líng","","hán","chán","qī","qiè"]},"author":{"text":"宋 · 柳永","pinyin":["sòng","","","","liǔ","yǒng"]},"body":{"text":"寒蝉凄切，对长亭晚，骤雨初歇。都门帐饮无绪，留恋处，兰舟催发。执手相看泪眼，竟无语凝噎。念去去，千里烟波，暮霭沉沉楚天阔。\n多情自古伤离别，更那堪，冷落清秋节！今宵酒醒何处？杨柳岸，晓风残月。此去经年，应是良辰好景虚设。便纵有千种风情，更与何人说？","pinyin":["hán","chán","qī","qiè","","duì","cháng","tíng","wǎn","","zhòu","yǔ","chū","xiē","","dū","mén","zhàng","yǐn","wú","xù","","liú","liàn","chù","","lán","zhōu","cuī","fā","","zhí","shǒu","xiāng","kàn","lèi","yǎn","","jìng","wú","yǔ","níng","yē","","niàn","qù","qù","","qiān","lǐ","yān","bō","","mù","ǎi","chén","chén","chǔ","tiān","kuò","","","duō","qíng","zì","gǔ","shāng","lí","bié","","gèng","nǎ","kān","","lěng","luò","qīng","qiū","jié","","jīn","xiāo","jiǔ","xǐng","hé","chù","","yáng","liǔ","àn","","xiǎo","fēng","cán","yuè","","cǐ","qù","jīng","nián","","yīng","shì","liáng","chén","hǎo","jǐng","xū","shè","","biàn","zòng","yǒu","qiān","zhǒng","fēng","qíng","","gèng","yǔ","hé","rén","shuō",""]},"variants":["留恋处 一作：方留恋处","好景 一作：美景"],"quote":"今宵酒醒何处？杨柳岸，晓风残月。","background":"柳永以秋日离开都城、与恋人惜别为情境写成的慢词，充分展开了长调可以细写情事的特点。","reading":"词从寒蝉、长亭与骤雨写到执手相看，再想象船行之后的孤独。最著名的酒醒画面发生在未来：杨柳、晓风、残月，将眼前的不舍延伸成一路相随的离愁。","backgroundUrl":"https://www.guwendao.net/shiwenv_4d795944b856.aspx"},{"n":63,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_632c5beb84eb.aspx","title":{"text":"水调歌头·明月几时有","pinyin":["shuǐ","diào","gē","tóu","","míng","yuè","jǐ","shí","yǒu"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。\n\n明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。","pinyin":["bǐng","chén","zhōng","qiū","","huān","yǐn","dá","dàn","","dà","zuì","","zuò","cǐ","piān","","jiān","huái","zǐ","yóu","","","","míng","yuè","jǐ","shí","yǒu","","bǎ","jiǔ","wèn","qīng","tiān","","bù","zhī","tiān","shàng","gōng","què","","jīn","xī","shì","hé","nián","","wǒ","yù","chéng","fēng","guī","qù","","yòu","kǒng","qióng","lóu","yù","yǔ","","gāo","chù","bù","shèng","hán","","qǐ","wǔ","nòng","qīng","yǐng","","hé","sì","zài","rén","jiān","","","zhuǎn","zhū","gé","","dī","qǐ","hù","","zhào","wú","mián","","bù","yīng","yǒu","hèn","","hé","shì","cháng","xiàng","bié","shí","yuán","","rén","yǒu","bēi","huān","lí","hé","","yuè","yǒu","yīn","qíng","yuán","quē","","cǐ","shì","gǔ","nán","quán","","dàn","yuàn","rén","cháng","jiǔ","","qiān","lǐ","gòng","chán","juān",""]},"variants":["何似 一作：何时；又恐 一作：惟 / 唯恐","长向 一作：偏向"],"quote":"但愿人长久，千里共婵娟。","background":"词序说明写于丙辰中秋，苏轼在密州饮酒赏月，并怀念弟弟苏辙，子由即苏辙的字。","reading":"上片向往月宫又留恋人间，下片由月圆想到人的离合。情绪经过疑问与自我开解，最终落在共同赏月的祝愿上；缺憾仍在，人与人却可以通过思念保持联系。","backgroundUrl":"https://www.guwendao.net/shiwenv_632c5beb84eb.aspx"},{"n":64,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_5fb51378286c.aspx","title":{"text":"念奴娇·赤壁怀古","pinyin":["niàn","nú","jiāo","","chì","bì","huái","gǔ"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。","pinyin":["dà","jiāng","dōng","qù","","làng","táo","jìn","","qiān","gǔ","fēng","liú","rén","wù","","","gù","lěi","xī","biān","","rén","dào","shì","","sān","guó","zhōu","láng","chì","bì","","","luàn","shí","chuān","kōng","","jīng","tāo","pāi","àn","","juǎn","qǐ","qiān","duī","xuě","","","jiāng","shān","rú","huà","","yī","shí","duō","shǎo","háo","jié","","","","yáo","xiǎng","gōng","jǐn","dāng","nián","","xiǎo","qiáo","chū","jià","liǎo","","xióng","zī","yīng","fā","","","yǔ","shàn","guān","jīn","","tán","xiào","jiān","","qiáng","lǔ","huī","fēi","yān","miè","","","gù","guó","shén","yóu","","duō","qíng","yīng","xiào","wǒ","","zǎo","shēng","huá","fà","","","rén","shēng","rú","mèng","","yī","zūn","huán","lèi","jiāng","yuè",""]},"variants":["穿空 一作：崩云","樯橹 一作：强虏","人生 一作：人间；尊 同：樽"],"quote":"大江东去，浪淘尽，千古风流人物。","background":"苏轼被贬黄州时游赤壁矶而作。词中的黄州赤壁并不能直接等同于三国赤壁之战的确切战场。","reading":"壮阔江景引出周瑜年轻有为的形象，随后照见词人自己的失意与华发。怀古与自伤交汇，最后举酒酹月，试着把个人得失放入更长的历史与天地之中。","backgroundUrl":"https://www.guwendao.net/shiwenv_5fb51378286c.aspx"},{"n":65,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_6b30455fdd3c.aspx","title":{"text":"定风波·莫听穿林打叶声","pinyin":["dìng","fēng","bō","","mò","tīng","chuān","lín","dǎ","yè","shēng"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"三月七日，沙湖道中遇雨，雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此词。\n\n莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。","pinyin":["sān","yuè","qī","rì","","shā","hú","dào","zhōng","yù","yǔ","","yǔ","jù","xiān","qù","","tóng","xíng","jiē","láng","bèi","","yú","dú","bù","jué","","yǐ","ér","suì","qíng","","gù","zuò","cǐ","cí","","","","mò","tīng","chuān","lín","dǎ","yè","shēng","","hé","fáng","yín","xiào","qiě","xú","xíng","","zhú","zhàng","máng","xié","qīng","shèng","mǎ","","shuí","pà","","yī","suō","yān","yǔ","rèn","píng","shēng","","","liào","qiào","chūn","fēng","chuī","jiǔ","xǐng","","wēi","lěng","","shān","tóu","xié","zhào","què","xiāng","yíng","","huí","shǒu","xiàng","lái","xiāo","sè","chù","","guī","qù","","yě","wú","fēng","yǔ","yě","wú","qíng",""]},"variants":["萧瑟 一作：潇洒"],"quote":"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。","background":"苏轼谪居黄州期间出游遇雨，词序交代同行者狼狈、自己却不觉如此，后来天又放晴。","reading":"从雨中步行写到回望风雨，普通经历逐渐生出人生意味。竹杖草鞋与吟啸徐行表现出主动选择的从容，末句则进一步放下对晴雨、顺逆的执着。","backgroundUrl":"https://www.guwendao.net/shiwenv_6b30455fdd3c.aspx"},{"n":66,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_85b8792a66ac.aspx","title":{"text":"江城子·密州出猎","pinyin":["jiāng","chéng","zǐ","","mì","zhōu","chū","liè"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。\n酒酣胸胆尚开张。鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。","pinyin":["lǎo","fū","liáo","fā","shào","nián","kuáng","","zuǒ","qiān","huáng","","yòu","qíng","cāng","","jǐn","mào","diāo","qiú","","qiān","qí","juǎn","píng","gāng","","wèi","bào","qīng","chéng","suí","tài","shǒu","","qīn","shè","hǔ","","kàn","sūn","láng","","","jiǔ","hān","xiōng","dǎn","shàng","kāi","zhāng","","bìn","wēi","shuāng","","yòu","hé","fáng","","chí","jié","yún","zhōng","","hé","rì","qiǎn","féng","táng","","huì","wǎn","diāo","gōng","rú","mǎn","yuè","","xī","běi","wàng","","shè","tiān","láng",""]},"variants":[],"quote":"会挽雕弓如满月，西北望，射天狼。","background":"苏轼任密州知州时出猎所作，借狩猎表达希望得到任用、为国效力的心愿。","reading":"上片铺陈骑射队伍和百姓随行的热烈场面，下片借冯唐、魏尚的典故表达期待。结尾拉弓向西北的动作，把昂扬气势落实为守边报国的志向。","backgroundUrl":"https://www.guwendao.net/shiwenv_85b8792a66ac.aspx"},{"n":67,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_567fcf6ffefb.aspx","title":{"text":"江城子·乙卯正月二十日夜记梦","pinyin":["jiāng","chéng","zǐ","","yǐ","mǎo","zhēng","yuè","èr","shí","rì","yè","jì","mèng"]},"author":{"text":"宋 · 苏轼","pinyin":["sòng","","","","sū","shì"]},"body":{"text":"十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。\n夜来幽梦忽还乡，小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。","pinyin":["shí","nián","shēng","sǐ","liǎng","máng","máng","","bù","sī","liáng","","zì","nán","wàng","","qiān","lǐ","gū","fén","","wú","chù","huà","qī","liáng","","zòng","shǐ","xiāng","féng","yīng","bù","shí","","chén","mǎn","miàn","","bìn","rú","shuāng","","","yè","lái","yōu","mèng","hū","huán","xiāng","","xiǎo","xuān","chuāng","","zhèng","shū","zhuāng","","xiāng","gù","wú","yán","","wéi","yǒu","lèi","qiān","háng","","liào","dé","nián","nián","cháng","duàn","chù","","míng","yuè","yè","","duǎn","sōng","gāng",""]},"variants":[],"quote":"十年生死两茫茫，不思量，自难忘。","background":"苏轼在密州任上梦见亡妻王弗后写下此词。题中的乙卯年为1075年，距王弗去世已十年。","reading":"上片写十年间难以消退的思念，下片梦回两人相处的日常。最动人的重逢没有长篇倾诉，只有相顾流泪；醒后再想象月夜孤坟，使梦中的温暖转为长久的痛惜。","backgroundUrl":"https://www.guwendao.net/shiwenv_567fcf6ffefb.aspx"},{"n":68,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_76a124fc2fb8.aspx","title":{"text":"渔家傲·秋思","pinyin":["yú","jiā","ào","","qiū","sī"]},"author":{"text":"宋 · 范仲淹","pinyin":["sòng","","","","fàn","zhòng","yān"]},"body":{"text":"塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。","pinyin":["sài","xià","qiū","lái","fēng","jǐng","yì","","héng","yáng","yàn","qù","wú","liú","yì","","sì","miàn","biān","shēng","lián","jiǎo","qǐ","","qiān","zhàng","lǐ","","cháng","yān","luò","rì","gū","chéng","bì","","","zhuó","jiǔ","yī","bēi","jiā","wàn","lǐ","","yān","rán","wèi","lè","guī","wú","jì","","qiāng","guǎn","yōu","yōu","shuāng","mǎn","dì","","rén","bù","mèi","","jiāng","jūn","bái","fà","zhēng","fū","lèi",""]},"variants":[],"quote":"人不寐，将军白发征夫泪。","background":"范仲淹在西北边地参与对西夏的防务时所作，既有守边者的责任，也有久离家乡的感受。","reading":"塞外异景、号角与孤城先形成苍凉气氛，随后写饮酒思乡却无法归去。战事未了和归心难抑同时存在，结尾把将军与士卒放在一起，使边塞情感更复杂也更有人情。","backgroundUrl":"https://www.guwendao.net/shiwenv_76a124fc2fb8.aspx"},{"n":69,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_9822debcdc64.aspx","title":{"text":"破阵子·为陈同甫赋壮词以寄之","pinyin":["pò","zhèn","zǐ","","wèi","chén","tóng","fǔ","fù","zhuàng","cí","yǐ","jì","zhī"]},"author":{"text":"宋 · 辛弃疾","pinyin":["sòng","","","","xīn","qì","jí"]},"body":{"text":"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！","pinyin":["zuì","lǐ","tiǎo","dēng","kàn","jiàn","","mèng","huí","chuī","jiǎo","lián","yíng","","bā","bǎi","lǐ","fēn","huī","xià","zhì","","wǔ","shí","xián","fān","sài","wài","shēng","","shā","chǎng","qiū","diǎn","bīng","","","mǎ","zuò","dì","lú","fēi","kuài","","gōng","rú","pī","lì","xián","jīng","","liǎo","què","jūn","wáng","tiān","xià","shì","","yíng","dé","shēng","qián","shēn","hòu","míng","","kě","lián","bái","fà","shēng",""]},"variants":[],"quote":"了却君王天下事，赢得生前身后名。可怜白发生！","background":"辛弃疾失意闲居时寄给陈亮的词，陈同甫即陈亮。两人都关心恢复中原，彼此以诗词相勉。","reading":"醉中挑灯看剑，梦里回到军营，阅兵、奏乐、驰马、射箭接连展开。直到最后一句突然转回白发的现实，前面的壮阔因这一跌落而更显悲凉，也更能见出志向未酬。","backgroundUrl":"https://www.guwendao.net/shiwenv_9822debcdc64.aspx"},{"n":70,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_12e69f000057.aspx","title":{"text":"永遇乐·京口北固亭怀古","pinyin":["yǒng","yù","lè","","jīng","kǒu","běi","gù","tíng","huái","gǔ"]},"author":{"text":"宋 · 辛弃疾","pinyin":["sòng","","","","xīn","qì","jí"]},"body":{"text":"千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。\n元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？","pinyin":["qiān","gǔ","jiāng","shān","","yīng","xióng","wú","mì","","sūn","zhòng","móu","chù","","wǔ","xiè","gē","tái","","fēng","liú","zǒng","bèi","","yǔ","dǎ","fēng","chuī","qù","","xié","yáng","cǎo","shù","","xún","cháng","xiàng","mò","","rén","dào","jì","nú","céng","zhù","","xiǎng","dāng","nián","","jīn","gē","tiě","mǎ","","qì","tūn","wàn","lǐ","rú","hǔ","","","yuán","jiā","cǎo","cǎo","","fēng","láng","jū","xū","","yíng","dé","cāng","huáng","běi","gù","","sì","shí","sān","nián","","wàng","zhōng","yóu","jì","","fēng","huǒ","yáng","zhōu","lù","","kě","kān","huí","shǒu","","bì","lí","cí","xià","","yī","piàn","shén","yā","shè","gǔ","","píng","shuí","wèn","","lián","pō","lǎo","yǐ","","shàng","néng","fàn","fǒu",""]},"variants":[],"quote":"凭谁问：廉颇老矣，尚能饭否？","background":"辛弃疾晚年在京口任职、登北固亭怀古时所作。当时朝廷筹划北伐，他既盼恢复失地，也忧虑准备不足。","reading":"孙权、刘裕、刘义隆等人的往事分别带出建功、北伐与失败的教训。最后以廉颇自比，问自己是否仍会被任用；典故串起的，是对现实局势的判断与报国无门的焦急。","backgroundUrl":"https://www.guwendao.net/shiwenv_12e69f000057.aspx"},{"n":71,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_51aa3a553057.aspx","title":{"text":"青玉案·元夕","pinyin":["qīng","yù","àn","","yuán","xī"]},"author":{"text":"宋 · 辛弃疾","pinyin":["sòng","","","","xīn","qì","jí"]},"body":{"text":"东风夜放花千树。更吹落、星如雨。宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。\n蛾儿雪柳黄金缕。笑语盈盈暗香去。众里寻他千百度。蓦然回首，那人却在，灯火阑珊处。","pinyin":["dōng","fēng","yè","fàng","huā","qiān","shù","","gèng","chuī","luò","","xīng","rú","yǔ","","bǎo","mǎ","diāo","chē","xiāng","mǎn","lù","","fèng","xiāo","shēng","dòng","","yù","hú","guāng","zhuǎn","","yī","yè","yú","lóng","wǔ","","","é","ér","xuě","liǔ","huáng","jīn","lǚ","","xiào","yǔ","yíng","yíng","àn","xiāng","qù","","zhòng","lǐ","xún","tā","qiān","bǎi","dù","","mò","rán","huí","shǒu","","nà","rén","què","zài","","dēng","huǒ","lán","shān","chù",""]},"variants":[],"quote":"众里寻他千百度。蓦然回首，那人却在，灯火阑珊处。","background":"辛弃疾写元宵灯节的词，以满城繁华中的寻觅为中心。后世也常从中读出词人的人格寄托。","reading":"花灯、烟火、车马与歌舞把热闹推到极处，最后却在灯火稀疏处找到那个人。喧闹与寂静形成鲜明对照；既可读相遇的惊喜，也可读对独立、不随众的精神气质的珍视。","backgroundUrl":"https://www.guwendao.net/shiwenv_51aa3a553057.aspx"},{"n":72,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_9dcf133d25cc.aspx","title":{"text":"天净沙·秋思","pinyin":["tiān","jìng","shā","","qiū","sī"]},"author":{"text":"元 · 马致远","pinyin":["yuán","","","","mǎ","zhì","yuǎn"]},"body":{"text":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。","pinyin":["kū","téng","lǎo","shù","hūn","yā","","xiǎo","qiáo","liú","shuǐ","rén","jiā","","gǔ","dào","xī","fēng","shòu","mǎ","","xī","yáng","xī","xià","","duàn","cháng","rén","zài","tiān","yá",""]},"variants":[],"quote":"夕阳西下，断肠人在天涯。","background":"马致远的散曲小令，借秋日旅途表现游子思乡。“天净沙”是曲牌名，“秋思”点明主题。","reading":"枯藤、老树、昏鸦等景物紧密排列，像几个连续镜头。小桥流水人家的安宁，又衬出古道瘦马的漂泊；最后出现“断肠人”，前面的景象便都汇入他的心情。","backgroundUrl":"https://www.guwendao.net/shiwenv_9dcf133d25cc.aspx"},{"n":73,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_2523dc7baa84.aspx","title":{"text":"卜算子·咏梅","pinyin":["bǔ","suàn","zǐ","","yǒng","méi"]},"author":{"text":"宋 · 陆游","pinyin":["sòng","","","","lù","yóu"]},"body":{"text":"驿外断桥边，寂寞开无主。已是黄昏独自愁，更着风和雨。\n无意苦争春，一任群芳妒。零落成泥碾作尘，只有香如故。","pinyin":["yì","wài","duàn","qiáo","biān","","jì","mò","kāi","wú","zhǔ","","yǐ","shì","huáng","hūn","dú","zì","chóu","","gèng","zhuó","fēng","hé","yǔ","","","wú","yì","kǔ","zhēng","chūn","","yī","rèn","qún","fāng","dù","","líng","luò","chéng","ní","niǎn","zuò","chén","","zhǐ","yǒu","xiāng","rú","gù",""]},"variants":["着 同：著"],"quote":"零落成泥碾作尘，只有香如故。","background":"陆游以梅花寄托志向的咏物词，常结合他仕途受挫而始终坚持操守的经历来读。","reading":"驿外断桥、黄昏风雨写出梅花的困境，后半转向它不争春、不改香的品格。花即使凋落，也仍保有本来的气息，由此写出外部遭遇无法轻易改变的内在坚持。","backgroundUrl":"https://www.guwendao.net/shiwenv_2523dc7baa84.aspx"},{"n":74,"group":"旷达与深情","url":"https://www.guwendao.net/shiwenv_284e20a25958.aspx","title":{"text":"临江仙·滚滚长江东逝水","pinyin":["lín","jiāng","xiān","","gǔn","gǔn","cháng","jiāng","dōng","shì","shuǐ"]},"author":{"text":"明 · 杨慎","pinyin":["míng","","","","yáng","shèn"]},"body":{"text":"滚滚长江东逝水，浪花淘尽英雄。是非成败转头空。青山依旧在，几度夕阳红。\n白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢。古今多少事，都付笑谈中。","pinyin":["gǔn","gǔn","cháng","jiāng","dōng","shì","shuǐ","","làng","huā","táo","jìn","yīng","xióng","","shì","fēi","chéng","bài","zhuǎn","tóu","kōng","","qīng","shān","yī","jiù","zài","","jǐ","dù","xī","yáng","hóng","","","bái","fà","yú","qiáo","jiāng","zhǔ","shàng","","guàn","kàn","qiū","yuè","chūn","fēng","","yī","hú","zhuó","jiǔ","xǐ","xiāng","féng","","gǔ","jīn","duō","shǎo","shì","","dōu","fù","xiào","tán","zhōng",""]},"variants":[],"quote":"青山依旧在，几度夕阳红。","background":"明代杨慎的咏史词，以江山与人物的消长展开对历史、人生的思考。","reading":"江水东流、青山依旧，与英雄功业的消逝形成对照。下片由壮阔历史转入江边渔樵的一壶酒和笑谈，拉开与成败得失的距离，语气中既有苍凉，也有看开后的从容。","backgroundUrl":"https://www.guwendao.net/shiwenv_284e20a25958.aspx"},{"n":75,"group":"值得慢慢读的长诗","url":"https://www.guwendao.net/shiwenv_3aed26d1fa99.aspx","title":{"text":"春江花月夜","pinyin":["chūn","jiāng","huā","yuè","yè"]},"author":{"text":"唐 · 张若虚","pinyin":["táng","","","","zhāng","ruò","xū"]},"body":{"text":"春江潮水连海平，海上明月共潮生。\n滟滟随波千万里，何处春江无月明。\n江流宛转绕芳甸，月照花林皆似霰。\n空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。\n不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。\n谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月裴回，应照离人妆镜台。\n玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。\n鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。\n江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。\n不知乘月几人归，落月摇情满江树。","pinyin":["chūn","jiāng","cháo","shuǐ","lián","hǎi","píng","","hǎi","shàng","míng","yuè","gòng","cháo","shēng","","","yàn","yàn","suí","bō","qiān","wàn","lǐ","","hé","chù","chūn","jiāng","wú","yuè","míng","","","jiāng","liú","wǎn","zhuǎn","rào","fāng","diàn","","yuè","zhào","huā","lín","jiē","sì","xiàn","","","kōng","lǐ","liú","shuāng","bù","jué","fēi","","tīng","shàng","bái","shā","kàn","bù","jiàn","","","jiāng","tiān","yī","sè","wú","xiān","chén","","jiǎo","jiǎo","kōng","zhōng","gū","yuè","lún","","","jiāng","pàn","hé","rén","chū","jiàn","yuè","","jiāng","yuè","hé","nián","chū","zhào","rén","","","rén","shēng","dài","dài","wú","qióng","yǐ","", ,"quote":"蜀道之难，难于上青天！","background":"李白用乐府旧题歌咏入蜀道路的艰险。作品在安史之乱以前已经流传，具体寄赠对象与寓意仍有争议。","reading":"神话、夸张、飞瀑和险峰不断把难行推向极致，反复出现的叹句则改变侧重点：从山高路险，写到旅途惊惧，再到剑阁的军事危险。声势与内容一起层层加重。","backgroundUrl":"https://www.guwendao.net/shiwenv_d59ec5d6c91c.aspx"},{"n":78,"group":"值得慢慢读的长诗","url":"https://www.guwendao.net/shiwenv_05e2f6fc757c.aspx","title":{"text":"梦游天姥吟留别","pinyin":["mèng","yóu","tiān","mǔ","yín","liú","bié"]},"author":{"text":"唐 · 李白","pinyin":["táng","","","","lǐ","bái"]},"body":{"text":"海客谈瀛洲，烟涛微茫信难求；\n越人语天姥，云霞明灭或可睹。\n天姥连天向天横，势拔五岳掩赤城。\n天台四万八千丈，对此欲倒东南倾。\n\n我欲因之梦吴越，一夜飞度镜湖月。\n湖月照我影，送我至剡溪。\n谢公宿处今尚在，渌水荡漾清猿啼。\n脚著谢公屐，身登青云梯。\n半壁见海日，空中闻天鸡。\n千岩万转路不定，迷花倚石忽已暝。\n熊咆龙吟殷岩泉，栗深林兮惊层巅。\n云青青兮欲雨，水澹澹兮生烟。\n列缺霹雳，丘峦崩摧。\n洞天石扉，訇然中开。\n青冥浩荡不见底，日月照耀金银台。\n霓为衣兮风为马，云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，仙之人兮列如麻。\n忽魂悸以魄动，恍惊起而长嗟。\n惟觉时之枕席，失向来之烟霞。\n\n世间行乐亦如此，古来万事东流水。\n别君去兮何时还？且放白鹿青崖间，须行即骑访名山。\n安能摧眉折腰事权贵，使我不得开心颜？","pinyin":["hǎi","kè","tán","yíng","zhōu","","yān","tāo","wēi","máng","xìn","nán","qiú","","","yuè","rén","yù","tiān","mǔ","","yún","xiá","míng","miè","huò","kě","dǔ","","","tiān","mǔ","lián","tiān","xiàng","tiān","héng","","shì","bá","wǔ","yuè","yǎn","chì","chéng","","","tiān","tāi","sì","wàn","bā","qiān","zhàng","","duì","cǐ","yù","dào","dōng","nán","qīng","","","","wǒ","yù","yīn","zhī","mèng","wú","yuè","","yī","yè","fēi","dù","jìng","hú","yuè","","","hú","yuè","zhào","wǒ","yǐng","","sòng","wǒ","zhì","shàn","xī","","","xiè","gōng","sù","chù","jīn","shàng","zài","","lù","shuǐ","dàng","yàng","qīng","yuán","tí","","","jiǎo","zhuó","xiè","gōng","jī","","shēn","dēng","qīng","yún","tī","","","bàn","bì","jiàn","hǎi","rì","","kōng","zhōng","wén","tiān","jī","","","qiān","yán","wàn","zhuǎn","lù","bù","dìng","","mí","huā","yǐ","shí","hū","yǐ","míng","","","xióng","páo","lóng","yín","yǐn","yán","quán","","lì","shēn","lín","xī","jīng","céng","diān","","","yún","qīng","qīng","xī","yù","yù","","shuǐ","dàn","dàn","xī","shēng","yān","","","liè","quē","pī","lì","","qiū","luán","bēng","cuī","","","dòng","tiān","shí","fēi","","hōng","rán","zhōng","kāi","","","qīng","míng","hào","dàng","bù","jiàn","dǐ","","rì","yuè","zhào","yào","jīn","yín","tái","","","ní","wéi","yī","xī","fēng","wéi","mǎ","","yún","zhī","jūn","xī","fēn","fēn","ér","lái","xià","","","hǔ","gǔ","sè","xī","luán","huí","chē","","xiān","zhī","rén","xī","liè","rú","má","","","hū","hún","jì","yǐ","pò","dòng","","huǎng","jīng","qǐ","ér","cháng","jiē","","","wéi","jiào","shí","zhī","zhěn","xí","","shī","xiàng","lái","zhī","yān","xiá","","","","shì","jiān","xíng","lè","yì","rú","cǐ","","gǔ","lái","wàn","shì","dōng","liú","shuǐ","","","bié","jūn","qù","xī","hé","shí","huán","","qiě","fàng","bái","lù","qīng","yá","jiān","","xū","xíng","jí","qí","fǎng","míng","shān","","","ān","néng","cuī","méi","zhé","yāo","shì","quán","guì","","shǐ","wǒ","bù","dé","kāi","xīn","yán",""]},"variants":["云霞 一作：云霓","四万 一作：一万","栗 一作：慄"],"quote":"安能摧眉折腰事权贵，使我不得开心颜？","background":"一般认为作于李白离开长安后、将从东鲁前往吴越时，借梦游天姥山向友人告别。","reading":"梦境从月夜飞渡进入奇丽山林，再打开壮观的仙人世界，突然惊醒后只剩枕席。梦的自由与现实的束缚形成反差，最终引出维护人格、不愿屈从权贵的直抒胸臆。","backgroundUrl":"https://www.guwendao.net/shiwenv_05e2f6fc757c.aspx"},{"n":79,"group":"值得慢慢读的长诗","url":"https://www.guwendao.net/shiwenv_0581b0ba8bb4.aspx","title":{"text":"琵琶行","pinyin":["pí","pá","xíng"]},"author":{"text":"唐 · 白居易","pinyin":["táng","","","","bái","jū","yì"]},"body":{"text":"元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。\n\n浔阳江头夜送客，枫叶荻花秋瑟瑟。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n寻声暗问弹者谁，琵琶声停欲语迟。\n移船相近邀相见，添酒回灯重开宴。\n千呼万唤始出来，犹抱琵琶半遮面。\n转轴拨弦三两声，未成曲调先有情。\n弦弦掩抑声声思，似诉平生不得志。\n低眉信手续续弹，说尽心中无限事。\n轻拢慢捻抹复挑，初为《霓裳》后《六幺》。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹，大珠小珠落玉盘。\n间关莺语花底滑，幽咽泉流冰下难。\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\n别有幽愁暗恨生，此时无声胜有声。\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\n曲终收拨当心画，四弦一声如裂帛。\n东船西舫悄无言，唯见江心秋月白。\n沉吟放拨插弦中，整顿衣裳起敛容。\n自言本是京城女，家在虾蟆陵下住。\n十三学得琵琶成，名属教坊第一部。\n曲罢曾教善才服，妆成每被秋娘妒。\n五陵年少争缠头，一曲红绡不知数。\n钿头银篦击节碎，血色罗裙翻酒污。\n今年欢笑复明年，秋月春风等闲度。\n弟走从军阿姨死，暮去朝来颜色故。\n门前冷落鞍马稀，老大嫁作商人妇。\n商人重利轻别离，前月浮梁买茶去。\n去来江口守空船，绕船月明江水寒。\n夜深忽梦少年事，梦啼妆泪红阑干。\n\n我闻琵琶已叹息，又闻此语重唧唧。\n同是天涯沦落人，相逢何必曾相识！\n我从去年辞帝京，谪居卧病浔阳城。\n浔阳地僻无音乐，终岁不闻丝竹声。\n住近湓江地低湿，黄芦苦竹绕宅生。\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\n春江花朝秋月夜，往往取酒还独倾。\n岂无山歌与村笛，呕哑嘲哳难为听。\n今夜闻君琵琶语，如听仙乐耳暂明。\n莫辞更坐弹一曲，为君翻作《琵琶行》。\n\n感我此言良久立，却坐促弦弦转急。\n凄凄不似向前声，满座重闻皆掩泣。\n座中泣下谁最多？江州司马青衫湿。","pinyin":["yuán","hé","shí","nián","","yú","zuǒ","qiān","jiǔ","jiāng","jùn","sī","mǎ","","míng","nián","qiū","","sòng","kè","pén","pǔ","kǒu","","wén","zhōu","zhōng","yè","tán","pí","pá","zhě","","tīng","qí","yīn","","zhēng","zhēng","rán","yǒu","jīng","dū","shēng","","wèn","qí","rén","","běn","cháng","ān","chāng","nǚ","","cháng","xué","pí","pá","yú","mù","","cáo","èr","shàn","cái","","nián","zhǎng","sè","shuāi","","wěi","shēn","wéi","gǔ","rén","fù","","suì","mìng","jiǔ","","shǐ","kuài","tán","shù","qǔ","","qǔ","bà","mǐn","rán","","zì","xù","shào","xiǎo","shí","huān","lè","shì","","jīn","piāo","lún","qiáo","cuì","","zhuǎn","xǐ","yú","jiāng","hú","jiān","","yú","chū","guān","èr","nián","","tián","rán","zì","ān","","gǎn","sī","rén","yán","","shì","xī","shǐ","jué","yǒu","qiān","zhé","yì","","yīn","wéi","cháng","jù","","gē","yǐ","zèng","zhī","","fán","liù","bǎi","yī","shí","liù","yán","","mìng","yuē","","pí","pá","xíng","","","","","xún","yáng","jiāng","tóu","yè","sòng","kè","","fēng","yè","dí","huā","qiū","sè","sè","","","zhǔ","rén","xià","mǎ","kè","zài","chuán","","jǔ","jiǔ","yù","yǐn","wú","guǎn","xián","","","zuì","bù","chéng","huān","cǎn","jiāng","bié","","bié","shí","máng","máng","jiāng","jìn","yuè","","","hū","wén","shuǐ","shàng","pí","pá","shēng","","zhǔ","rén","wàng","guī","kè","bù","fā","","","xún","shēng","àn","wèn","tán","zhě","shuí","","pí","pá","shēng","tíng","yù","yǔ","chí","","","yí","chuán","xiāng","jìn","yāo","xiāng","jiàn","","tiān","jiǔ","huí","dēng","chóng","kāi","yàn","","","qiān","hū","wàn","huàn","shǐ","chū","lái","","yóu","bào","pí","pá","bàn","zhē","miàn","","","zhuǎn","zhóu","bō","xián","sān","liǎng","shēng","","wèi","chéng","qǔ","diào","xiān","yǒu","qíng","","","xián" \n回眸一笑百媚生，六宫粉黛无颜色。\n春寒赐浴华清池，温泉水滑洗凝脂。\n侍儿扶起娇无力，始是新承恩泽时。\n云鬓花颜金步摇，芙蓉帐暖度春宵。\n春宵苦短日高起，从此君王不早朝。\n承欢侍宴无闲暇，春从春游夜专夜。\n后宫佳丽三千人，三千宠爱在一身。\n金屋妆成娇侍夜，玉楼宴罢醉和春。\n姊妹弟兄皆列土，可怜光彩生门户。\n遂令天下父母心，不重生男重生女。\n骊宫高处入青云，仙乐风飘处处闻。\n缓歌慢舞凝丝竹，尽日君王看不足。\n渔阳鼙鼓动地来，惊破霓裳羽衣曲。\n九重城阙烟尘生，千乘万骑西南行。\n翠华摇摇行复止，西出都门百余里。\n六军不发无奈何，宛转蛾眉马前死。\n花钿委地无人收，翠翘金雀玉搔头。\n君王掩面救不得，回看血泪相和流。\n黄埃散漫风萧索，云栈萦纡登剑阁。\n峨嵋山下少人行，旌旗无光日色薄。\n蜀江水碧蜀山青，圣主朝朝暮暮情。\n行宫见月伤心色，夜雨闻铃肠断声。\n天旋地转回龙驭，到此踌躇不能去。\n马嵬坡下泥土中，不见玉颜空死处。\n君臣相顾尽沾衣，东望都门信马归。\n归来池苑皆依旧，太液芙蓉未央柳。\n芙蓉如面柳如眉，对此如何不泪垂？\n春风桃李花开日，秋雨梧桐叶落时。\n西宫南内多秋草，落叶满阶红不扫。\n梨园弟子白发新，椒房阿监青娥老。\n夕殿萤飞思悄然，孤灯挑尽未成眠。\n迟迟钟鼓初长夜，耿耿星河欲曙天。\n鸳鸯瓦冷霜华重，翡翠衾寒谁与共？\n悠悠生死别经年，魂魄不曾来入梦。\n临邛道士鸿都客，能以精诚致魂魄。\n为感君王辗转思，遂教方士殷勤觅。\n排空驭气奔如电，升天入地求之遍。\n上穷碧落下黄泉，两处茫茫皆不见。\n忽闻海上有仙山，山在虚无缥缈间。\n楼阁玲珑五云起，其中绰约多仙子。\n中有一人字太真，雪肤花貌参差是。\n金阙西厢叩玉扃，转教小玉报双成。\n闻道汉家天子使，九华帐里梦魂惊。\n揽衣推枕起徘徊，珠箔银屏迤逦开。\n云鬓半偏新睡觉，花冠不整下堂来。\n\n风吹仙袂飘飖举，犹似霓裳羽衣舞。\n玉容寂寞泪阑干，梨花一枝春带雨。\n含情凝睇谢君王，一别音容两渺茫。\n昭阳殿里恩爱绝，蓬莱宫中日月长。\n回头下望人寰处，不见长安见尘雾。\n惟将旧物表深情，钿合金钗寄将去。\n钗留一股合一扇，钗擘黄金合分钿。\n但令心似金钿坚，天上人间会相见。\n\n临别殷勤重寄词，词中有誓两心知。\n七月七日长生殿，夜半无人私语时。\n在天愿作比翼鸟，在地愿为连理枝。\n天长地久有时尽，此恨绵绵无绝期。","pinyin":["hàn","huáng","zhòng","sè","sī","qīng","guó","","yù","yǔ","duō","nián","qiú","bù","dé","","","yáng","jiā","yǒu","nǚ","chū","zhǎng","chéng","","yǎng","zài","shēn","guī","rén","wèi","shí","","","tiān","shēng","lì","zhì","nán","zì","qì","","yī","zhāo","xuǎn","zài","jūn","wáng","cè","","","huí","móu","yī","xiào","bǎi","mèi","shēng","","liù","gōng","fěn","dài","wú","yán","sè","","","chūn","hán","cì","yù","huá","qīng","chí","","wēn","quán","shuǐ","huá","xǐ","níng","zhī","","","shì","ér","fú","qǐ","jiāo","wú","lì","","shǐ","shì","xīn","chéng","ēn","zé","shí","","","yún","bìn","huā","yán","jīn","bù","yáo","","fú","róng","zhàng","nuǎn","dù","chūn","xiāo","","","chūn","xiāo","kǔ","duǎn","rì","gāo","qǐ","","cóng","cǐ","jūn","wáng","bù","zǎo","cháo","","","chéng","huān","shì","yàn","wú","xián","xiá","","chūn","cóng","chūn","yóu","yè","zhuān","yè","","","hòu","gōng","jiā","lì","sān","qiān","rén","","sān","qiān","chǒng","ài","zài","yī","shēn","","","jīn","wū
