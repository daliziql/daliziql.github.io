<script>
(() => {
const poems=JSON.parse(document.getElementById('poems-data').textContent);
const catalog=document.getElementById('catalog-content');
const content=document.getElementById('poems');
const escapeHTML=value=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function rubyText(data,tag,cls){
 const parts=[`<${tag} class="${cls}"><span class="verse-phrase">`];let unitOpen=false;
 Array.from(data.text).forEach((ch,i)=>{
  if(data.pinyin[i]){if(unitOpen)parts.push('</span>');parts.push(`<span class="ruby-unit"><ruby><span class="han">${escapeHTML(ch)}</span><rt>${escapeHTML(data.pinyin[i])}</rt></ruby>`);unitOpen=true;}
  else{parts.push(`<span class="punct">${escapeHTML(ch)}</span>`);if(/[，。？！；：、]/.test(ch)){if(unitOpen)parts.push('</span>');parts.push('</span><span class="verse-phrase">');unitOpen=false;}}
 });
 if(unitOpen)parts.push('</span>');parts.push(`</span></${tag}>`);return parts.join('');
}
const catalogParts=[],bodyParts=[];let currentGroup='';
for(const p of poems){
 if(p.n>1)bodyParts.push('<hr class="poem-divider">');
 if(p.group!==currentGroup){if(currentGroup)catalogParts.push('</div></details>');currentGroup=p.group;catalogParts.push(`<details class="catalog-group"${matchMedia('(max-width:600px)').matches?'':' open'}><summary><h3>${escapeHTML(p.group)}</h3></summary><div class="catalog-links">`);bodyParts.push(`<h2 class="group-title">${escapeHTML(p.group)}</h2>`);}
 catalogParts.push(`<a href="#poem-${p.n}"><span class="num">${String(p.n).padStart(2,'0')}</span>${escapeHTML(p.title.text)}</a>`);
 const lines=p.body.text.split('\n'),estimatedHeight=500+lines.reduce((h,line)=>h+(line?Math.ceil(line.length/24)*62:14),0);
 bodyParts.push(`<article id="poem-${p.n}" class="poem" aria-label="${escapeHTML(p.title.text)}" style="--estimated-height:${estimatedHeight}px"><h2 class="poem-title ruby-row">${escapeHTML(p.title.text)}</h2><div class="poem-author ruby-row">${escapeHTML(p.author.text)}</div><blockquote class="memorable"><span class="memorable-label">记忆名句</span><p>${escapeHTML(p.quote)}</p></blockquote><div class="poem-body">`);
 for(const line of lines)bodyParts.push(line?`<p class="poem-line ruby-row">${escapeHTML(line)}</p>`:'<div class="stanza-break"></div>');
 bodyParts.push('</div>');
 bodyParts.push(`<section class="poem-notes" aria-label="${escapeHTML(p.title.text)} 背景与解读"><h3>背景</h3><p>${escapeHTML(p.background)} <a class="notes-source" href="${escapeHTML(p.backgroundUrl)}" target="_blank" rel="noopener noreferrer">背景参考</a></p><h3>读懂这首诗</h3><p>${escapeHTML(p.reading)}</p></section>`);
 if(p.variants?.length)bodyParts.push(`<p class="variant">异文与通用字：${escapeHTML(p.variants.join('；'))}</p>`);
 bodyParts.push(`<div class="poem-footer"><a href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">原文与注释</a><a href="#catalog">返回目录</a></div></article>`);
}
catalogParts.push('</div></details>');catalog.innerHTML=catalogParts.join('');content.innerHTML=bodyParts.join('');
const articles=Array.from(content.querySelectorAll('.poem')),rendered=new Set();let observer;
function annotate(article){
 if(rendered.has(article))return;
 const p=poems[Number(article.id.slice(5))-1];if(!p)return;
 article.querySelector('.poem-title').outerHTML=rubyText(p.title,'h2','poem-title ruby-row');
 article.querySelector('.poem-author').outerHTML=rubyText(p.author,'div','poem-author ruby-row');
 const lines=[];let offset=0;for(const line of p.body.text.split('\n')){lines.push(line?rubyText({text:line,pinyin:p.body.pinyin.slice(offset,offset+line.length)},'p','poem-line ruby-row'):'<div class="stanza-break"></div>');offset+=line.length+1;}
 article.querySelector('.poem-body').innerHTML=lines.join('');
 rendered.add(article);observer?.unobserve(article);
}
// Keep every poem's text searchable; create ruby markup only near the viewport.
if('IntersectionObserver' in window){
 observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting)annotate(entry.target);},{rootMargin:'1200px 0px'});
 articles.forEach(article=>observer.observe(article));
}else articles.forEach(annotate);
// Print needs all pinyin, including poems that have not been scrolled into view.
addEventListener('beforeprint',()=>articles.forEach(annotate));
let jumpSequence=0;
function alignTarget(){
 const target=document.getElementById(location.hash.slice(1));if(!target)return;
 if(target.classList.contains('poem'))annotate(target);
 const sequence=++jumpSequence;let remaining=3;
 // Nearby poems can change height when their pinyin is prepared. Re-align after layout.
 function settle(){if(sequence!==jumpSequence)return;target.scrollIntoView({behavior:'instant',block:'start'});if(remaining-->0)requestAnimationFrame(settle);}
 settle();
}
